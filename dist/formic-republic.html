function tutActive(){ return tutStep() < TUT.length; }
function initTut(){
  if (S.flags.tut !== undefined) return;
  const isNew = S.lifetime < 50 && !S.flights && !S.supers && !S.quotaN;
  S.flags.tut = isNew ? 0 : TUT.length;
  if (isNew){ S.flags.v4 = true; S.quota = null; }
}
function tabShown(t){ return tutStep() >= (TAB_AT[t]||0); }
const freshTabs = new Set();
/* Navigation: five sections in the bottom bar, each holding one or more of the
   internal tabs. Hill and Goals show their tabs as sub-tabs; March keeps its own
   Raids / Conquest / Abyss switch; the Nuptial Flight is the red header button. */
const GROUPS = {
  hill:  {label:'Hill',  icon:'ant',   tabs:['castes','research'], sub:[['castes','Castes'],['research','Lab']]},
  march: {label:'March', icon:'map',   tabs:['raids']},
  cards: {label:'Cards', icon:'cards', tabs:['cards']},
  goals: {label:'Goals', icon:'star',  tabs:['medals','pass'], sub:[['medals:dir','Directives'],['pass','Pass'],['medals:medals','Medals']]},
  world: {label:'Ranks', icon:'crown', tabs:['ranks','alliance'], sub:[['ranks','Weekly league'],['alliance','Alliance']]},
  shop:  {label:'Shop',  icon:'bag',   tabs:['shop']},
};
const GROUP_OF = {castes:'hill', research:'hill', raids:'march', cards:'cards', medals:'goals', pass:'goals', ranks:'world', alliance:'world', shop:'shop', flight:'flight'};
const lastIn = {hill:'castes', goals:'medals', world:'ranks'};
function goTab(t, goalsSect){ tab = t; if (t === 'medals' && goalsSect) sect.goals = goalsSect; freshTabs.delete(t); confirmUntil = 0; render(); $('list').scrollTop = 0; }
function finishTut(){
  Analytics.ev('tutorial_complete');
  S.inv.rush = (S.inv.rush||0) + 1; S.inv.basket = (S.inv.basket||0) + 1; addGems(25);
  ['pass','medals','flight','ranks'].forEach(t => freshTabs.add(t));
  showModal('Training complete', 'The Bureau is open', 'Pass, Goals, Ranks and the Nuptial Flight are now on the panel. Goals holds three Daily Directives that refresh every day. Ranks is the weekly league: race other colonies and team up with friends in an alliance. Your quotas will vary from here on. You also got +25 amber, a Sugar Rush and a Picnic Basket on your belt.', 'Glory to the hill');
}

/* ---------- quotas (the Plan) ---------- */
function genQuota(){
  const n = S.quotaN;
  while (tutActive()){
    const st = tutStep(), t = TUT[st];
    if (t.skip && t.skip(S)){ S.flags.tut = st + 1; continue; }
    if (t.begin) t.begin(S);
    Object.keys(TAB_AT).forEach(k => { if (TAB_AT[k] === st && st > 0) freshTabs.add(k); });
    S.quota = {kind:t.kind, target:t.target, progress:0, label:t.label, reward:t.reward, jelly:0, gems:t.gems||2, go:t.go||null, tut:st};
    return;
  }
  let pool = ['gather','taps','hire'];
  const cheap = availableUpgrades(S).some(u => upgCost(u) < S.crumbs + D.baseCps*240 + 200);
  if (cheap) pool.push('research');
  if (n >= 2) pool.push('picnic','incident');
  if (EXPEDITIONS.some(canSend) || Object.keys(S.exp).length) pool.push('raid');
  if (S.quota) pool = pool.filter(k => k !== S.quota.kind);
  const k = pool[Math.floor(Math.random()*pool.length)];
  let target, label;
  if (k==='gather'){ target = Math.max(80, Math.round(D.baseCps*150 + D.baseTap*30)); label = `Gather ${fmt(target)} crumbs`; }
  else if (k==='taps'){ target = 40 + Math.min(n,12)*10; label = `Tap the hill ${target} times`; }
  else if (k==='hire'){ target = 4 + Math.min(n,16)*2; label = `Hire ${target} comrades`; }
  else if (k==='research'){ target = 1; label = 'Complete a research project'; }
  else if (k==='picnic'){ target = 1; label = 'Raid a picnic sugar cube'; }
  else if (k==='raid'){ target = 1; label = 'Bring a raiding squad home'; }
  else { target = 1; label = 'Resolve an incident'; }
  S.quota = {kind:k, target, progress:0, label, reward: Math.max(60, D.baseCps*240 + D.baseTap*40), jelly: (n+1)%5===0 ? 1 : 0};
}
function track(kind, amt){
  dirTrack(kind, amt);
  const q = S.quota; if (!q || q.kind !== kind) return;
  q.progress += amt;
  if (q.progress >= q.target){
    S.quotaN++; dirTrack('quota', 1);
    S.crumbs += q.reward; S.run += q.reward; S.lifetime += q.reward; S.ascLife += q.reward;
    if (q.jelly) S.jelly += q.jelly;
    const gm = q.gems || (q.jelly ? 10 : 2);
    addGems(gm); merit(40);
    toast(`Quota ${S.quotaN} fulfilled`, `+${fmt(q.reward)} crumbs` + (q.jelly ? ' and +1 royal jelly' : '') + ` · +${gm} amber. The Plan is ahead of schedule.`, q.jelly ? 'jelly' : 'gold', 'scroll');
    if (q.tut !== undefined){ S.flags.tut = q.tut + 1; Analytics.ev('tutorial_step', {step: q.tut + 1}); if (!tutActive()) finishTut(); }
    const qe = $('quota'); qe.classList.remove('stamped'); void qe.offsetWidth; qe.classList.add('stamped');
    Sound.stamp(); bump();
    genQuota();
  }
}

/* ---------- The Abyss (endgame after the first Supercolony) ----------
   An endless dig downward. Each depth is guarded by a creature you fight on the hill:
   30 seconds, every tap (and every drone tap) hits it. Win to go one depth deeper and
   earn Abyssal Shards; shards buy Primordial Packs. Every 10th depth is a Matriarch
   (big shard haul + a Primordial Pack); every 15th raises a Primordial card.
   Guardian health grows about 3.2x per depth, so the depth you can reach tracks how
   strong the current colony is, and keeps going for as long as the numbers do.
   Five torches a day (one fight each). Depth, shards and cards survive every reset. */
const ABYSS_TORCHES = 5, ABYSS_SECS = 30, ABYSS_TORCH_AMBER = 25, ABYSS_EXTRA_CAP = 2;
const GUARD_MINOR = ['Mole Cricket Sentinel','Blind Cave Beetle','Root Wyrm','Termite Inquisitor','Velvet Worm','Cave Centipede','Pale Mantis','Bone Weevil','Glow-Worm Choir'];
const GUARD_BOSS = ['The Clay Matriarch','The Fossil Matriarch','The Magma Matriarch','The Iron-Core Matriarch','The Matriarch of Echoes','The Last Matriarch'];
function abyssUnlocked(){ return (S.supers||0) >= 1; }
function guardianHP(d){ return 300 * Math.pow(10, (d - 1) / 2); }
function guardianName(d){ return d % 10 === 0 ? GUARD_BOSS[(d/10 - 1) % GUARD_BOSS.length] + (d > 60 ? ' ' + ROMAN[Math.min(5, Math.floor((d-1)/60))] : '') : GUARD_MINOR[(d - 1) % GUARD_MINOR.length]; }
function guardianShards(d){ return 4 + Math.floor(d / 5) + (d % 10 === 0 ? 20 : 0); }
function abyssDay(){ const a = S.abyss, k = dayKey(Date.now()); if (a.day !== k){ a.day = k; a.torches = Math.max(a.torches, ABYSS_TORCHES); a.extra = 0; } return a; }
// Rough damage a player deals in one fight: ~6 taps/s with fervor near its peak, plus drones.
function abyssEstimate(){ return D.tapValue * (1 + (D.fervMax - 1) * .8) * 6 * ABYSS_SECS * D.abyssMult + D.drones * D.tapValue * ABYSS_SECS * D.abyssMult; }
function startGuardian(){
  const a = abyssDay(); if (!abyssUnlocked() || a.torches <= 0) return;
  if (colony.busy() || activeEvent){ toast('The hill is busy', 'Deal with what is on the hill first, then descend.', 'bad', 'warn'); return; }
  const d = a.depth + 1;
  a.torches--;
  colony.spawnGuardian({depth: d, name: guardianName(d), hp: guardianHP(d), boss: d % 10 === 0, secs: ABYSS_SECS});
  nextEventAt = Math.max(nextEventAt, Date.now() + 60000);
  toast(d % 10 === 0 ? 'A Matriarch rises!' : 'A guardian rises!', `${guardianName(d)} blocks depth ${d}. Tap the hill for 30 seconds!`, 'bad', 'swords');
  Sound.alert(); buzz([60,40,60]); save(); render();
}
function guardianWon(d){
  const a = S.abyss; a.depth = Math.max(a.depth, d); a.wins++;
  const sh = guardianShards(d); a.shards += sh; merit(30);
  let extra = '';
  if (d % 10 === 0){ S.packs.primordial = (S.packs.primordial||0) + 1; extra += ' and a Primordial Pack'; }
  if (d % 15 === 0){
    const missing = CARDS.filter(c => c.r === 'P' && !S.cards[c.id]);
    if (missing.length){ const c = missing[Math.floor(Math.random()*missing.length)]; grantCard(c.id); D = derive(S);
      showModal('From the deep', c.name, `A Primordial card rises at depth ${d}. ${cardFx(c, 1)}.`, 'Bow to it'); }
    else { S.packs.primordial = (S.packs.primordial||0) + 1; extra += ' and a Primordial Pack'; }
  }
  toast(`Depth ${d} cleared`, `+${sh} Abyssal Shards${extra}.`, 'gold', 'swords'); Sound.stamp(); buzz([30,30,80]);
  save(); if (tab === 'raids') render();
}
function guardianLost(d, frac){
  toast('The guardian holds', `You dealt ${Math.round(frac*100)}% of its health. Grow the colony, or try Mandible Oil and a full fervor meter.`, 'bad', 'down'); Sound.bad();
  save(); if (tab === 'raids') render();
}
let torchBusy = false;
async function buyTorch(how){
  const a = abyssDay(); if (torchBusy) return;
  if (how === 'ad'){
    if (a.extra >= ABYSS_EXTRA_CAP) return;
    torchBusy = true; const ok = adFree() ? true : await Monetize.showRewarded('torch'); torchBusy = false;
    if (!ok) return; a.extra++; a.torches++;
  } else {
    if (S.gems < ABYSS_TORCH_AMBER){ toast('Not enough amber', `A torch costs ${ABYSS_TORCH_AMBER} amber.`, 'bad', 'gem'); return; }
    S.gems -= ABYSS_TORCH_AMBER; a.torches++;
  }
  toast('Torch lit', 'One more descent into the Abyss.', 'gold', 'sun'); Sound.good(); afterChange(); render();
}
function buyPrimPack(){
  const a = S.abyss, pk = PACKS.primordial;
  if (a.shards < pk.shards){ toast('Not enough shards', `A Primordial Pack costs ${pk.shards} Abyssal Shards.`, 'bad', 'star'); return; }
  a.shards -= pk.shards; S.packs.primordial = (S.packs.primordial||0) + 1;
  toast('Primordial Pack', 'Added. Open it in Cards.', 'gold', 'cards'); Sound.buy(); afterChange(); render();
}
function abyssHTML(){
  if (!abyssUnlocked()) return `<div class="abyss-head locked-abyss"><div class="ph-eyebrow">THE ABYSS · SEALED</div><div class="abyss-title">Something is down there</div>
    <p>Form your first <b>Supercolony</b> (Flight tab) to break the seal. Below the hill wait endless depths, guardians to fight, Abyssal Shards, and the six <b>Primordial</b> cards, the rarest in the Republic.</p></div>`;
  const a = abyssDay(), d = a.depth + 1, hp = guardianHP(d), est = abyssEstimate(), frac = Math.min(1, est / hp);
  const fighting = colony.guardianActive();
  const nextBoss = Math.ceil(d / 10) * 10, nextPrim = Math.ceil(d / 15) * 15;
  const primLeft = CARDS.filter(c => c.r === 'P' && !S.cards[c.id]).length;
  const chance = frac >= 1 ? 'Likely win' : frac >= .7 ? 'Close fight' : frac >= .35 ? 'Hard' : 'Out of reach for now';
  let html = `<div class="abyss-head"><div class="abyss-top"><div><div class="ph-eyebrow">THE ABYSS</div><div class="abyss-title">Depth ${a.depth} cleared</div></div>
    <div class="abyss-res"><span>${icon('sun')}<b>${a.torches}</b> torch${a.torches === 1 ? '' : 'es'}</span><span>${icon('star')}<b>${fmt(a.shards)}</b> shards</span></div></div>
    <div class="guard ${d % 10 === 0 ? 'boss' : ''}"><div class="guard-ic">${icon(d % 10 === 0 ? 'crown' : 'bug')}</div>
      <div class="row-main"><div class="guard-eyebrow">DEPTH ${d}${d % 10 === 0 ? ' · MATRIARCH' : ''}</div><div class="guard-name">${guardianName(d)}</div>
      <div class="guard-hp">Health <b>${fmt(hp)}</b> · your 30 seconds ≈ <b>${fmt(est)}</b></div>
      <div class="guard-bar"><div style="width:${(frac*100).toFixed(1)}%"></div></div>
      <div class="guard-odds ${frac >= 1 ? 'good' : frac >= .7 ? 'close' : 'bad'}">${chance}</div></div></div>
    <button class="btn abyss-go" data-descend ${a.torches > 0 && !fighting ? '' : 'disabled'}>${fighting ? 'Fight in progress: tap the hill!' : a.torches > 0 ? `Descend · 1 torch` : 'No torches left today'}</button>
    <div class="abyss-reward">Win: +${guardianShards(d)} shards${d % 10 === 0 ? ' + Primordial Pack' : ''}${d % 15 === 0 && primLeft ? ' + a Primordial card' : ''}</div></div>`;
  html += `<div class="srow"><div class="si" style="color:var(--crumb-deep)">${icon('sun')}</div><div class="row-main"><div class="row-name">Extra torch</div><div class="row-sub">Five torches return every day. ${ABYSS_EXTRA_CAP - a.extra} free extra left today.</div></div>
    <div class="torch-btns"><button class="gbtn ${adFree() ? 'free' : 'ad'}" data-torch="ad" ${a.extra < ABYSS_EXTRA_CAP ? '' : 'disabled'}>${adFree() ? 'Claim' : icon('play') + 'Watch'}</button><button class="gbtn" data-torch="amber">${icon('gem')}${ABYSS_TORCH_AMBER}</button></div></div>`;
  html += `<div class="srow"><div class="si" style="color:var(--r-p)">${icon('cards')}</div><div class="row-main"><div class="row-name">Primordial Pack</div><div class="row-sub">3 cards: epic or better, 2% Primordial per card. One is guaranteed by your ${PRIM_PITY}th pack (${Math.max(1, PRIM_PITY - a.ppity)} to go).</div></div>
    <button class="gbtn prim" data-primpack ${a.shards >= PACKS.primordial.shards ? '' : 'disabled'}>${icon('star')}${PACKS.primordial.shards}</button></div>`;
  html += `<div class="shop-sec">Milestones</div><div class="abyss-miles">
    <div><b>Depth ${nextBoss}</b><span>${guardianName(nextBoss)}: +${guardianShards(nextBoss)} shards and a Primordial Pack</span></div>
    <div><b>Depth ${nextPrim}</b><span>${primLeft ? 'A Primordial card rises' : 'All six Primordials found: a Primordial Pack instead'}</span></div></div>`;
  html += `<div class="locked">Each depth is about 3× tougher than the last, so your reach grows with the colony: dive deep late in a run, when taps hit hardest. Taps get stronger with Solidarity Tapping research, fervor, Mandible Oil and tap cards. Drones fight too. Depth, shards and Primordial cards are kept through every flight and Supercolony.</div>`;
  return html;
}

/* ---------- Daily Directives ----------
   Three goals a day (they scale with the colony), each paying amber and crumbs.
   Finish all three for the Directive Chest. Finish every directive on 5 days
   of a week for the Weekly Chest. One free swap a day (behind an ad on mobile).
   Directives survive flights; they unlock once training is done. */
const DIR_KINDS = {
  taps:     {icon:'up',     make:s => { const t = 150 + Math.min(s.quotaN,40)*5; return [t, `Tap the hill ${t} times`]; }},
  hire:     {icon:'ant',    make:s => { const t = Math.max(10, Math.min(60, Math.round(totalOwned(s)*.15) + 10)); return [t, `Hire ${t} comrades`]; }},
  gather:   {icon:'crumb',  make:s => { const t = Math.max(2000, Math.round(D.baseCps*900 + D.baseTap*300)); return [t, `Gather ${fmt(t)} crumbs`]; }},
  quota:    {icon:'scroll', make:s => [3, 'Fulfil 3 Plan quotas']},
  raid:     {icon:'map',    make:s => [2, 'Bring home 2 raiding squads']},
  incident: {icon:'warn',   make:s => [3, 'Resolve 3 incidents']},
  research: {icon:'flask',  make:s => [2, 'Complete 2 research projects'], ok:s => availableUpgrades(s).length + s.bought.length >= 2},
  picnic:   {icon:'gift',   make:s => [2, 'Raid 2 picnic sugar cubes']},
  pack:     {icon:'cards',  make:s => [1, 'Open a card pack']},
};
const DIR_WEEK_GOAL = 5;
function weekKey(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return dayKey(d.getTime()); }
function dirReward(){ return {gems: 10, crumbs: Math.max(500, Math.round(D.baseCps*300 + D.baseTap*60))}; }
function makeDirective(exclude){
  const pool = Object.keys(DIR_KINDS).filter(k => !exclude.includes(k) && (!DIR_KINDS[k].ok || DIR_KINDS[k].ok(S)));
  const k = pool[Math.floor(Math.random()*pool.length)];
  const [target, label] = DIR_KINDS[k].make(S);
  return {kind:k, target, label, progress:0, claimed:false, reward:dirReward()};
}
function checkDirectives(){
  if (tutActive()) return;
  const now = Date.now(), today = dayKey(now), wk = weekKey(now);
  const d = S.dir;
  if (d.week !== wk){ d.week = wk; d.days = []; d.weekClaimed = false; }
  if (d.day === today) return;
  d.day = today; d.list = []; d.chest = false; d.swapped = false;
  for (let i = 0; i < 3; i++) d.list.push(makeDirective(d.list.map(x => x.kind)));
  if (d.seen) toast('New Daily Directives', 'Three fresh goals are waiting in Goals.', 'gold', 'scroll');
  d.seen = true;
  if (tab === 'medals') render();
}
function dirTrack(kind, amt){
  const d = S.dir; if (!d || !d.list) return;
  for (const x of d.list){
    if (x.kind !== kind || x.progress >= x.target) continue;
    x.progress = Math.min(x.target, x.progress + amt);
    if (x.progress >= x.target){ toast('Directive complete', `${x.label}. Claim the reward in Goals.`, 'gold', DIR_KINDS[x.kind].icon); Sound.stamp(); }
  }
}
function dirClaimable(){
  const d = S.dir; if (!d || !d.list || !d.list.length) return 0;
  let n = d.list.filter(x => x.progress >= x.target && !x.claimed).length;
  if (!d.chest && d.list.every(x => x.claimed)) n++;
  if (!d.weekClaimed && (d.days||[]).length >= DIR_WEEK_GOAL) n++;
  return n;
}
function claimDirective(i){
  const d = S.dir, x = d.list[i]; if (!x || x.claimed || x.progress < x.target) return;
  x.claimed = true; addGems(x.reward.gems); gain(x.reward.crumbs); merit(30); bump();
  toast('Directive reward', `+${x.reward.gems} amber and +${fmt(x.reward.crumbs)} crumbs.`, 'gold', 'gem'); Sound.good();
}
function claimDirChest(){
  const d = S.dir; if (d.chest || !d.list.every(x => x.claimed)) return;
  d.chest = true; S.packs.rare = (S.packs.rare||0) + 1; addGems(20); merit(100);
  if (!d.days.includes(d.day)) d.days.push(d.day);
  showModal('Directive Chest', 'All 3 done!', `A Brigade Pack (open it in Cards), +20 amber and 100 pass merit. Week progress: ${d.days.length}/${DIR_WEEK_GOAL} full days.`, 'Glory to the Plan');
  Sound.stamp();
}
function claimWeekChest(){
  const d = S.dir; if (d.weekClaimed || d.days.length < DIR_WEEK_GOAL) return;
  d.weekClaimed = true; S.packs.epic = (S.packs.epic||0) + 1; S.jelly += 1; addGems(50);
  showModal('Weekly Chest', 'Hero of the Week', 'A Politburo Pack, 1 royal jelly and +50 amber. A new week of directives starts on Monday.', 'Long live the hill');
  Sound.stamp();
}
let swapBusy = false;
async function swapDirective(i){
  const d = S.dir, x = d.list[i]; if (!x || d.swapped || x.claimed || swapBusy) return;
  swapBusy = true;
  const ok = adFree() ? true : await Monetize.showRewarded('swap');
  swapBusy = false;
  if (!ok || d.swapped) return;
  d.swapped = true; d.list[i] = makeDirective(d.list.map(y => y.kind));
  toast('Directive swapped', d.list[i].label + '.', 'good', DIR_KINDS[d.list[i].kind].icon);
  save(); render();
}
function dirHTML(){
  const d = S.dir;
  if (tutActive() || !d.list || !d.list.length) return `<div class="locked">Daily Directives unlock when training is done.</div>`;
  const now = Date.now(), mid = new Date(now); mid.setHours(24,0,0,0);
  const allClaimed = d.list.every(x => x.claimed);
  let html = `<div class="dir-head"><div><div class="ph-eyebrow">DAILY DIRECTIVES</div><div class="dir-title">Today's orders from the Politburo</div></div><div class="dir-clock">New in<br><b>${fmtTime((mid - now)/1000)}</b></div></div>`;
  html += d.list.map((x,i) => {
    const done = x.progress >= x.target;
    const btn = x.claimed ? `<span class="dir-done">${icon('star')} Done</span>`
      : done ? `<button class="btn gold dir-btn" data-dclaim="${i}">Claim</button>`
      : !d.swapped ? `<button class="gbtn ${adFree() ? 'free' : 'ad'} dir-swap" data-dswap="${i}">${adFree() ? '' : icon('play')}Swap</button>` : '';
    return `<div class="dir ${x.claimed ? 'claimed' : done ? 'ready' : ''}" data-di="${i}"><div class="dir-ic">${icon(DIR_KINDS[x.kind].icon)}</div>
      <div class="row-main"><div class="row-name">${x.label}</div>
        <div class="dir-bar"><div class="dir-fill" style="width:${Math.min(100, x.progress/x.target*100)}%"></div></div>
        <div class="dir-meta"><span class="dir-prog">${x.kind === 'gather' ? fmt(x.progress) + ' / ' + fmt(x.target) : x.progress + ' / ' + x.target}</span><span>${icon('gem')}${x.reward.gems} · ${icon('crumb')}${fmt(x.reward.crumbs)}</span></div></div>
      <div class="dir-act">${btn}</div></div>`;
  }).join('');
  const chestReady = allClaimed && !d.chest;
  html += `<div class="dir-chest ${chestReady ? 'ready' : d.chest ? 'claimed' : ''}"><div class="dir-ic big">${icon('gift')}</div>
    <div class="row-main"><div class="row-name">Directive Chest</div><div class="row-sub">Finish all three: a Brigade Pack and 20 amber.</div></div>
    <div class="dir-act">${d.chest ? `<span class="dir-done">${icon('star')} Opened</span>` : `<button class="btn gold dir-btn" data-dchest ${chestReady ? '' : 'disabled'}>${chestReady ? 'Open' : d.list.filter(x=>x.claimed).length + '/3'}</button>`}</div></div>`;
  const days = d.days || [], wkReady = days.length >= DIR_WEEK_GOAL && !d.weekClaimed;
  html += `<div class="dir-week"><div class="dir-week-top"><span><b>Weekly Chest</b> · ${Math.min(days.length, DIR_WEEK_GOAL)}/${DIR_WEEK_GOAL} full days</span><span>Politburo Pack · 1 jelly · 50 amber</span></div>
    <div class="dir-dots">${Array.from({length:7}, (_,i) => `<i class="${i < days.length ? 'on' : ''} ${i === DIR_WEEK_GOAL-1 ? 'goal' : ''}"></i>`).join('')}</div>
    ${d.weekClaimed ? `<div class="dir-done" style="justify-content:center">${icon('star')} Claimed this week</div>` : `<button class="btn ${wkReady ? 'gold' : ''}" style="width:100%;font-size:16px;padding:9px" data-dweek ${wkReady ? '' : 'disabled'}>${wkReady ? 'Open the Weekly Chest' : 'Resets every Monday'}</button>`}</div>`;
  html += `<div class="locked">${d.swapped ? 'You have used today\'s swap.' : `You can swap one directive a day${adFree() ? '' : ' by watching a broadcast'}.`} Directives are kept through the Nuptial Flight.</div>`;
  return html;
}

/* ============================================================
   ONLINE: weekly league + colony alliances
   Weekly score = pass merit earned this week (taps, quotas, raids, incidents,
   picnics, packs, medals, Congress days). It rewards activity, not progress,
   so new colonies can race veterans. Weeks are ISO weeks in UTC and reset on
   Monday 00:00 UTC. Members' points this week fill their alliance's war chest.

   Backend: Supabase project "formic-republic" (SQL functions fr_*). The server
   checks every report: it accepts at most 2.5 points a second since the last
   one plus a 2,500-point buffer, so an edited save can't climb faster than a
   very active real player (extra points wait and count later). The store
   shells can pass their own {url, key} in FR_PLATFORM.online.
   In the claude.ai preview, if the page can't reach Supabase, the league runs
   on the artifact's own shared database instead: a friends-only preview league.
   ============================================================ */

function leagueWeek(t){
  const d = new Date(t), x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dn = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - dn);
  const y = x.getUTCFullYear(), w = Math.ceil(((x - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
  return `${y}-W${String(w).padStart(2, '0')}`;
}
function leagueEnds(t){ const d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - (d.getUTCDay() + 6) % 7 + 7); }
function weekLabel(k){ return k ? 'Week ' + +k.split('-W')[1] : ''; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function leagueRoll(){
  const o = S.online, wk = leagueWeek(Date.now());
  if (o.week === wk) return false;
  if (o.week){ o.prevWeek = o.week; o.prevScore = o.score; }
  o.week = wk; o.score = 0;
  for (const a of Object.values(o.acct)) a.sent = 0;
  return true;
}
function leagueAdd(n){ if (!S || !(n > 0)) return; leagueRoll(); S.online.score += n; }
function chestReward(t){ return [`${t.gems} amber`, t.pack ? `${t.n > 1 ? t.n + '× ' : ''}${PACKS[t.pack].name}` : '', t.use ? `${t.n}× ${USABLES[t.use].name}` : '', t.jelly ? `${t.jelly} royal jelly` : ''].filter(Boolean).join(' · '); }
function rewardLine(r){ return [`${r.gems} amber`, ...Object.entries(r.packs).map(([k,n]) => `${n > 1 ? n + '× ' : ''}${PACKS[k].name}`)].join(' · '); }

const ONLINE_ERR = {
  offline:'Could not reach the league server. Check your connection.',
  server:'The league server had a problem. Try again in a moment.',
  bad_player:'This colony is not registered on this server.',
  bad_name_length:'Names need 2 to 20 characters (alliances 3 to 24).',
  bad_name_chars:'Use letters, numbers, spaces and _ . - \' only.',
  name_taken:'An alliance with that name already exists.',
  no_such_code:'No alliance has that code. Check it with your friend.',
  alliance_full:'That alliance is full (20 members).',
  already_in_alliance:'Leave your current alliance first.',
};
function onlineErr(code){ const e = new Error(ONLINE_ERR[code] || ONLINE_ERR.server); e.code = code; return e; }

// Real backend: Supabase RPC over HTTPS. Works in the Android (Expo) and Steam (Electron) shells.
const SupaAPI = {
  kind:'supabase',
  async rpc(fn, args){
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const tm = setTimeout(() => ctl && ctl.abort(), 9000);
    let res;
    try { res = await fetch(`${ONLINE.url}/rest/v1/rpc/${fn}`, {method:'POST', headers:{apikey:ONLINE.key, 'Content-Type':'application/json'}, body:JSON.stringify(args || {}), signal: ctl ? ctl.signal : undefined}); }
    catch(e){ throw onlineErr('offline'); }
    finally { clearTimeout(tm); }
    let body = null; try { body = await res.json(); } catch(e){}
    if (!res.ok) throw onlineErr(body && ONLINE_ERR[body.message] ? body.message : 'server');
    return body;
  },
  register(name){ return this.rpc('fr_register', {p_name:name}); },
  rename(a, name){ return this.rpc('fr_rename', {p_id:a.id, p_secret:a.secret, p_name:name}); },
  submit(a, week, score){ return this.rpc('fr_submit', {p_id:a.id, p_secret:a.secret, p_season:week, p_score:Math.floor(score)}); },
  board(a, week){ return this.rpc('fr_leaderboard', {p_season:week, p_id:a ? a.id : null, p_limit:50}); },
  allianceBoard(week){ return this.rpc('fr_alliance_board', {p_season:week, p_limit:50}); },
  mine(a, week){ return this.rpc('fr_my_alliance', {p_id:a.id, p_secret:a.secret, p_season:week}); },
  create(a, name){ return this.rpc('fr_create_alliance', {p_id:a.id, p_secret:a.secret, p_name:name}); },
  join(a, code){ return this.rpc('fr_join_alliance', {p_id:a.id, p_secret:a.secret, p_code:code}); },
  leave(a){ return this.rpc('fr_leave_alliance', {p_id:a.id, p_secret:a.secret}); },
  remove(a){ return this.rpc('fr_delete_player', {p_id:a.id, p_secret:a.secret}); },
};

// Preview backend: the claude.ai artifact's shared database (only used when Supabase is unreachable).
// One document per player at players/<viewer id> (only that viewer may write it); alliances/<id> docs.
// There is no server-side check here, so it is meant for a group of friends trying the game.
function makeDbAPI(db, uid){
  const meRef = () => db.doc('players/' + uid);
  const NAME_OK = /^[\p{L}\p{N} _'.-]+$/u;
  const clean = (n, lo, hi) => { n = String(n || '').trim().replace(/\s+/g, ' '); if (n.length < lo || n.length > hi) throw onlineErr('bad_name_length'); if (!NAME_OK.test(n)) throw onlineErr('bad_name_chars'); return n; };
  const wrap = async f => { try { return await f(); } catch(e){ throw e && e.code && ONLINE_ERR[e.code] ? e : onlineErr('server'); } };
  const players = async () => (await db.collection('players').limit(1000).get()).docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data()));
  const alliances = async () => (await db.collection('alliances').limit(1000).get()).docs.filter(d => d.exists).map(d => Object.assign({id:d.id}, d.data()));
  const scoreIn = (p, wk) => p.week === wk ? (p.score || 0) : (p.prev && p.prev.week === wk ? p.prev.score || 0 : 0);
  async function mine(a, week){
    const wk = week || leagueWeek(Date.now());
    const s = await meRef().get(); const p = s.exists ? s.data() : null;
    if (!p) throw onlineErr('bad_player');
    if (!p.alliance) return {season:wk, alliance:null};
    const as = await db.doc('alliances/' + p.alliance).get();
    if (!as.exists){ await meRef().update({alliance:null, apts:0}); return {season:wk, alliance:null}; }
    const al = as.data(), all = await players();
    const members = all.filter(x => x.alliance === p.alliance).map(x => ({name:x.name, points: x.week === wk ? x.apts || 0 : 0, owner: x.id === al.owner, me: x.id === uid})).sort((x, y) => y.points - x.points);
    const total = members.reduce((n, m) => n + m.points, 0);
    const board = await api.allianceBoard(wk), row = board.alliances.find(r => r.id === p.alliance);
    return {season:wk, alliance:{id:p.alliance, name:al.name, code:al.code, owner: al.owner === uid, total, rank: row ? row.rank : board.alliances.length + 1, members, max:20}};
  }
  const api = {
    kind:'preview',
    register: name => wrap(async () => { name = clean(name, 2, 20); const wk = leagueWeek(Date.now());
      await meRef().set({name, alliance:null, week:wk, score:0, apts:0, prev:null, at:Date.now()}); return {id:uid, secret:'', name, season:wk}; }),
    rename: (a, name) => wrap(async () => { name = clean(name, 2, 20); await meRef().update({name}); return {name}; }),
    submit: (a, week, score) => wrap(async () => {
      const s = await meRef().get(); const p = s.exists ? s.data() : null; if (!p) throw onlineErr('bad_player');
      const cur = leagueWeek(Date.now()); if (week !== cur) return {season:cur, score:0, accepted:0, stale:true};
      const same = p.week === cur, base = same ? p.score || 0 : 0, delta = Math.max(0, Math.floor(score) - base);
      if (!delta && same) return {season:cur, score:base, accepted:0};
      await meRef().update({week:cur, score:base + delta, apts:(same ? p.apts || 0 : 0) + (p.alliance ? delta : 0), prev: same ? (p.prev || null) : (p.week ? {week:p.week, score:p.score || 0} : null), at:Date.now()});
      return {season:cur, score:base + delta, accepted:delta};
    }),
    board: (a, week) => wrap(async () => {
      const [ps, als] = await Promise.all([players(), alliances()]), names = Object.fromEntries(als.map(x => [x.id, x.name]));
      const rows = ps.map(p => ({id:p.id, name:p.name, alliance:names[p.alliance] || null, score:scoreIn(p, week)})).filter(p => p.score > 0).sort((x, y) => y.score - x.score)
        .map((p, i) => ({rank:i + 1, name:p.name, score:p.score, alliance:p.alliance, me:p.id === uid}));
      const m = rows.find(r => r.me);
      return {season:week, players:rows.length, top:rows.slice(0, 50), me: m ? {rank:m.rank, score:m.score} : null, around: m ? rows.slice(Math.max(0, m.rank - 3), m.rank + 2) : []};
    }),
    allianceBoard: week => wrap(async () => {
      const [ps, als] = await Promise.all([players(), alliances()]);
      const rows = als.map(al => { const ms = ps.filter(p => p.alliance === al.id); return {id:al.id, name:al.name, members:ms.length, total:ms.reduce((n, p) => n + (p.week === week ? p.apts || 0 : 0), 0)}; })
        .filter(r => r.members > 0).sort((x, y) => y.total - x.total || x.name.localeCompare(y.name)).map((r, i) => Object.assign(r, {rank:i + 1}));
      return {season:week, alliances:rows.slice(0, 50)};
    }),
    mine: (a, week) => wrap(() => mine(a, week)),
    create: (a, name) => wrap(async () => {
      name = clean(name, 3, 24);
      const als = await alliances();
      if (als.some(x => String(x.name).toLowerCase() === name.toLowerCase())) throw onlineErr('name_taken');
      const AB = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code;
      do { code = Array.from({length:6}, () => AB[Math.floor(Math.random() * AB.length)]).join(''); } while (als.some(x => x.code === code));
      const ref = db.collection('alliances').doc();
      await ref.set({name, code, owner:uid, at:Date.now()});
      await meRef().update({alliance:ref.id, apts:0});
      return mine(a);
    }),
    join: (a, code) => wrap(async () => {
      const s = await meRef().get(); if (s.exists && s.data().alliance) throw onlineErr('already_in_alliance');
      code = String(code || '').trim().toUpperCase();
      const al = (await alliances()).find(x => x.code === code); if (!al) throw onlineErr('no_such_code');
      if ((await players()).filter(p => p.alliance === al.id).length >= 20) throw onlineErr('alliance_full');
      await meRef().update({alliance:al.id, apts:0});
      return mine(a);
    }),
    leave: a => wrap(async () => {
      const s = await meRef().get(), aid = s.exists ? s.data().alliance : null; if (!aid) return {alliance:null};
      await meRef().update({alliance:null, apts:0});
      const rest = (await players()).filter(p => p.alliance === aid && p.id !== uid);
      const ar = db.doc('alliances/' + aid);
      if (!rest.length) await ar.delete();
      else { const al = await ar.get(); if (al.exists && al.data().owner === uid) await ar.update({owner:rest[0].id}); }
      return {alliance:null};
    }),
    remove: a => wrap(async () => { await api.leave(a); await meRef().delete(); return {deleted:true}; }),
  };
  return api;
}

const Online = {
  api:null, status:'idle', lastTry:0, lastSync:0, lastMine:0,
  board:null, aboard:null, mine:null, boardAt:0, aboardAt:0, view:'players', busy:false, leaveArmed:0, delArmed:0,
  acct(){ return this.api ? S.online.acct[this.api.kind] || null : null; },
  wanted(){ return tab === 'ranks' || tab === 'alliance' || Object.keys(S.online.acct).length > 0; },
  async init(){
    if (this.status !== 'idle') return;
    this.status = 'connecting'; this.lastTry = Date.now(); this.changed();
    try { await SupaAPI.allianceBoard(leagueWeek(Date.now())); this.api = SupaAPI; }
    catch(e){
      // Supabase unreachable. In the claude.ai preview, fall back to the artifact's shared database.
      try {
        const c = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
        const [db, user] = c ? await Promise.all([c.use('db'), c.use('user')]) : [null, null];
        const uid = db && user && typeof user.id === 'function' ? await user.id() : null;
        if (db && uid){ this.api = makeDbAPI(db, uid); await this.api.allianceBoard(leagueWeek(Date.now())); }
        else this.api = null;
      } catch(e2){ this.api = null; }
    }
    this.status = this.api ? 'ready' : 'offline';
    if (this.api){ await this.payout(); this.refreshMine(); this.sync(); }
    this.changed();
  },
  tick(now){
    if (!S) return;
    if (leagueRoll()){ this.board = this.aboard = this.mine = null; this.boardAt = this.aboardAt = this.lastMine = 0; this.payout(); }
    if (this.status === 'offline' && now - this.lastTry > 60000 && this.wanted()) this.status = 'idle';
    if (this.status === 'idle' && this.wanted()){ this.init(); return; }
    if (this.status !== 'ready' || !this.acct()) return;
    const a = this.acct();
    if (now - this.lastSync > 45000 && S.online.score > (a.sent || 0)) this.sync();
    if (now - this.lastMine > 120000) this.refreshMine();
  },
  async sync(force){
    const a = this.acct(); if (!a || this.syncing) return;
    if (!force && S.online.score <= (a.sent || 0)) return;
    this.syncing = true; this.lastSync = Date.now();
    try {
      const r = await this.api.submit(a, S.online.week, S.online.score);
      if (r && r.stale){ leagueRoll(); } else if (r){ a.sent = r.score; }
      save();
    } catch(e){ if (e.code === 'bad_player'){ delete S.online.acct[this.api.kind]; save(); this.changed(); } }
    this.syncing = false;
  },
  async refreshMine(){
    const a = this.acct(); if (!a) return;
    this.lastMine = Date.now();
    try { const r = await this.api.mine(a, S.online.week); this.mine = r.alliance; this.changed(); } catch(e){}
  },
  async load(kind){
    if (this.status !== 'ready') return;
    const now = Date.now(), a = this.acct();
    try {
      if (kind === 'players' && now - this.boardAt > 20000){ this.boardAt = now; if (a) await this.sync(); this.board = await this.api.board(a, S.online.week); this.changed(); }
      if (kind === 'alliances' && now - this.aboardAt > 20000){ this.aboardAt = now; this.aboard = await this.api.allianceBoard(S.online.week); this.changed(); }
      if (kind === 'mine' && a && now - this.lastMine > 15000){ await this.sync(); await this.refreshMine(); }
    } catch(e){ this.err = e.message; this.changed(); }
  },
  // Last week's league rewards, granted once when a new week starts.
  async payout(){
    const o = S.online, a = this.acct();
    if (!a || !o.prevWeek || o.paid === o.prevWeek || this.status !== 'ready') return;
    const wk = o.prevWeek;
    try {
      const b = await this.api.board(a, wk);
      o.paid = wk;
      const me = b.me;
      const r = me && LEAGUE_REWARDS.find(x => me.rank <= x.max && me.score >= (x.min || 0));
      if (r){
        addGems(r.gems); for (const [k, n] of Object.entries(r.packs)) S.packs[k] = (S.packs[k] || 0) + n;
        showModal(`League results · ${weekLabel(wk)}`, `#${me.rank} of ${b.players}`, `${r.label}! You scored ${fmt(me.score)} points. Reward: ${rewardLine(r)}. Packs are waiting in Cards. A new week has begun.`, 'Glory to the hill');
        Sound.stamp();
      }
      save();
    } catch(e){}
  },
  async act(kind, arg){
    if (this.busy || this.status !== 'ready') return;
    this.busy = true; this.changed(true);
    try {
      const a = this.acct();
      if (kind === 'register'){
        const r = await this.api.register(arg);
        S.online.acct[this.api.kind] = {id:r.id, secret:r.secret || '', name:r.name, sent:0};
        Analytics.ev('league_join', {backend: this.api.kind});
        this.lastSync = 0; await this.sync(true); this.boardAt = 0; await this.load('players');
        toast('Welcome to the league', `${r.name} is on the board. Earn merit this week to climb.`, 'gold', 'crown'); Sound.good();
      } else if (kind === 'rename'){
        const r = await this.api.rename(a, arg); a.name = r.name; this.boardAt = 0; this.renaming = false; await this.load('players');
        toast('Colony renamed', r.name, 'good', 'scroll');
      } else if (kind === 'create'){
        const r = await this.api.create(a, arg); this.mine = r.alliance; this.aboardAt = this.boardAt = 0; Analytics.ev('alliance_create');
        toast('Alliance founded', `Share the code ${r.alliance.code} with your friends.`, 'gold', 'flag'); Sound.stamp();
      } else if (kind === 'join'){
        const r = await this.api.join(a, arg); this.mine = r.alliance; this.aboardAt = this.boardAt = 0; Analytics.ev('alliance_join');
        toast('Alliance joined', `You march with ${r.alliance.name}. Points you earn from now count toward its war chest.`, 'gold', 'flag'); Sound.good();
      } else if (kind === 'leave'){
        await this.api.leave(a); this.mine = null; this.aboardAt = this.boardAt = 0;
        toast('You left the alliance', 'Your colony marches alone again.', 'neutral', 'flag');
      } else if (kind === 'delete'){
        // Removes the player, names, scores and alliance points from the server (privacy policy: "Delete my league entry").
        await this.api.remove(a); delete S.online.acct[this.api.kind];
        this.mine = this.board = this.aboard = null; this.aboardAt = this.boardAt = this.lastMine = 0; this.renaming = false;
        toast('League entry deleted', 'Your colony name and scores are gone from the server.', 'neutral', 'scroll');
      }
      save();
    } catch(e){ toast("That didn't work", e.message, 'bad', 'warn'); Sound.bad(); }
    this.busy = false; this.changed(true);
  },
  chestReady(){
    const m = this.mine; if (!m) return 0;
    const me = m.members.find(x => x.me), c = S.online.chest;
    if (!me || me.points < CHEST_MIN) return 0;
    const got = c.week === S.online.week ? c.got : [];
    return CHEST_TIERS.filter((t, i) => m.total >= t.need && !got.includes(i)).length;
  },
  claimChest(i){
    const m = this.mine, t = CHEST_TIERS[i], c = S.online.chest;
    if (!m || !t) return;
    if (c.week !== S.online.week){ c.week = S.online.week; c.got = []; }
    const me = m.members.find(x => x.me);
    if (c.got.includes(i) || m.total < t.need || !me || me.points < CHEST_MIN) return;
    c.got.push(i); addGems(t.gems);
    if (t.pack) S.packs[t.pack] = (S.packs[t.pack] || 0) + (t.n || 1);
    if (t.use) S.inv[t.use] = (S.inv[t.use] || 0) + t.n;
    if (t.jelly) S.jelly += t.jelly;
    toast('War chest opened', chestReward(t) + '.', 'gold', 'gift'); Sound.stamp();
    afterChange(); this.changed(true);
  },
  // Redraw the online tabs when data arrives, unless the player is typing in one of their fields.
  changed(force){
    if (tab !== 'ranks' && tab !== 'alliance') return;
    const ae = document.activeElement;
    if (!force && ae && ae.tagName === 'INPUT' && $('list').contains(ae)){ this.pending = true; return; }
    this.pending = false; render();
  },
};

function onlineClick(el){
  const k = el.dataset.on, val = id => ($(id) || {}).value || '';
  if (k === 'register') Online.act('register', val('on-name'));
  else if (k === 'renameopen'){ Online.renaming = !Online.renaming; render(); }
  else if (k === 'rename') Online.act('rename', val('on-rename'));
  else if (k === 'create') Online.act('create', val('on-aname'));
  else if (k === 'join') Online.act('join', val('on-code'));
  else if (k === 'delete'){ if (Date.now() < Online.delArmed){ Online.delArmed = 0; Online.act('delete'); } else { Online.delArmed = Date.now() + 4000; render(); setTimeout(() => { if (tab === 'ranks') render(); }, 4100); } }
  else if (k === 'leave'){ if (Date.now() < Online.leaveArmed){ Online.leaveArmed = 0; Online.act('leave'); } else { Online.leaveArmed = Date.now() + 4000; render(); } }
  else if (k === 'copy'){ const code = Online.mine && Online.mine.code; try { navigator.clipboard.writeText(code).then(() => toast('Code copied', `Send ${code} to your friends.`, 'good', 'flag'), () => toast('Alliance code', code, 'good', 'flag')); } catch(e){ toast('Alliance code', code, 'good', 'flag'); } }
  else if (k === 'sync'){ Online.sync(true).then(() => { Online.boardAt = 0; Online.load('players'); }); }
  else if (k === 'retry'){ Online.status = 'idle'; Online.init(); }
  else if (k.startsWith('view:')){ Online.view = k.slice(5); render(); }
  else if (k.startsWith('chest:')) Online.claimChest(+k.slice(6));
}

// Draws a 1080×1350 poster of the colony (the 4:5 size Instagram and most feeds show in full).
function drawShareCard(cv){
  const W = 1080, H = 1350, c = cv.getContext('2d'); cv.width = W; cv.height = H;
  const INK = '#1D1A2B', RED = '#E5392D', SUN = '#FFC738', PAPER = '#FFFBF3';
  const DISP = "'Dela Gothic One','Arial Black',Impact,sans-serif", BODY = "'Onest',system-ui,sans-serif";
  c.fillStyle = '#F7F0E3'; c.fillRect(0, 0, W, H);
  // sunburst behind the mascot
  const cx = W / 2, cy = 530;
  for (let i = 0; i < 24; i++){
    const a0 = i / 24 * Math.PI * 2, a1 = (i + 1) / 24 * Math.PI * 2;
    c.fillStyle = i % 2 ? SUN : '#FFE08A';
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 900, a0, a1); c.closePath(); c.fill();
  }
  c.fillStyle = RED; c.beginPath(); c.arc(cx, cy, 270, 0, Math.PI * 2); c.fill();
  // mascot, from the same vector as the advisor
  c.save(); c.translate(cx - 240, cy - 250); c.scale(4.8, 4.8); c.lineJoin = 'round'; c.lineCap = 'round';
  const P = d => new Path2D(d), F = ANT_FACE;
  c.strokeStyle = INK; c.lineWidth = 4; c.stroke(P(F.antL)); c.stroke(P(F.antR));
  c.fillStyle = INK; c.beginPath(); c.arc(14, 10, 4, 0, 7); c.arc(86, 10, 4, 0, 7); c.fill();
  [[F.head, '#8A3F1C', 4], [F.cap, RED, 4], [F.brim, '#B52A20', 4], [F.eyeL, '#fff', 3], [F.eyeR, '#fff', 3]].forEach(([d, f, w]) => { c.fillStyle = f; c.fill(P(d)); c.lineWidth = w; c.stroke(P(d)); });
  c.fillStyle = INK; c.fill(P(F.pupL)); c.fill(P(F.pupR)); c.lineWidth = 4; c.stroke(P(F.smile));
  c.restore();
  // title banner
  c.fillStyle = RED; c.fillRect(0, 60, W, 150); c.fillStyle = INK; c.fillRect(0, 210, W, 10);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `92px ${DISP}`; c.fillText('FORMIC REPUBLIC', cx, 137);
  // stats panel
  const acct = Object.values(S.online.acct)[0], name = acct ? acct.name : 'My Colony';
  const px = 70, py = 880, pw = W - 140, ph = 400;
  c.fillStyle = PAPER; c.strokeStyle = INK; c.lineWidth = 8;
  c.beginPath(); if (c.roundRect) c.roundRect(px, py, pw, ph, 40); else c.rect(px, py, pw, ph); c.fill(); c.stroke();
  c.fillStyle = INK; c.font = `64px ${DISP}`; c.fillText(name.slice(0, 22), cx, py + 70);
  c.fillStyle = RED; c.font = `110px ${DISP}`; c.fillText(fmt(D.cps), cx, py + 175);
  c.fillStyle = '#5E5872'; c.font = `700 34px ${BODY}`; c.fillText('CRUMBS PER SECOND', cx, py + 245);
  const cards = Object.keys(S.cards).length;
  c.fillStyle = INK; c.font = `700 36px ${BODY}`;
  c.fillText(`${fmt(S.lifetime)} crumbs gathered · ${S.flights} flights${S.supers ? ` · ${S.supers} supercolon${S.supers > 1 ? 'ies' : 'y'}` : ''}`, cx, py + 305);
  c.fillText(`${cards} cards · ${S.medals.length} medals${(S.abyss || {}).depth ? ` · Abyss depth ${S.abyss.depth}` : ''}`, cx, py + 355);
  // call to action, on an ink pill between the mascot and the stats
  c.font = `44px ${DISP}`; const tw = c.measureText('Can your colony beat mine?').width + 70;
  c.fillStyle = INK; c.beginPath(); if (c.roundRect) c.roundRect(cx - tw / 2, 806, tw, 58, 29); else c.rect(cx - tw / 2, 806, tw, 58); c.fill();
  c.fillStyle = SUN; c.fillText('Can your colony beat mine?', cx, 836);
}
async function shareColony(where){
  try { await Promise.all([document.fonts.load("92px 'Dela Gothic One'"), document.fonts.load("700 34px 'Onest'")]); } catch(e){}   // draw with the poster fonts
  const cv = document.createElement('canvas'); drawShareCard(cv);
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  const text = `My ant colony makes ${fmt(D.cps)} crumbs a second in Formic Republic. Can yours beat it?`;
  Analytics.ev('share', {where});
  try {
    const file = new File([blob], 'formic-republic.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text, title:'Formic Republic'}); return 'shared'; }
  } catch(e){ if (e && e.name === 'AbortError') return 'cancelled'; }
  if (hasNative){ const url = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); Native.post('share', {text, image:url}); return 'native'; }
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename:'formic-republic.png', data:blob}); return 'saved'; }
  } catch(e){ if (e && e.code !== 'unavailable') return 'cancelled'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'formic-republic.png'; document.body.appendChild(a); a.click(); a.remove();
  return 'downloaded';
}

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'); if (!cv) return;
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#E5392D', '#FFC738', '#2FA862', '#8E5BF2', '#1D1A2B', '#FFFBF3'];
  const ps = Array.from({length:140}, () => ({x:W / 2 + (Math.random() - .5) * W * .3, y:H * .35, vx:(Math.random() - .5) * 900, vy:-Math.random() * 900 - 200, r:Math.random() * 6, vr:(Math.random() - .5) * 12, w:6 + Math.random() * 6, h:8 + Math.random() * 8, c:cols[Math.floor(Math.random() * cols.length)]}));
  cv.hidden = false; let last = performance.now(); const end = last + 2600;
  (function step(t){
    const dt = Math.min(.04, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of ps){ p.vy += 1400 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t < end) requestAnimationFrame(step); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(last);
}

function dayKey(t){ const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function checkDaily(){
  const now = Date.now(), today = dayKey(now);
  if (S.daily.last === today) return;
  const yesterday = dayKey(now - 86400000);
  S.daily.streak = S.daily.last === yesterday ? S.daily.streak + 1 : 1;
  S.daily.last = today;
  S.daily.best = Math.max(S.daily.best, S.daily.streak);
  const st = S.daily.streak, day = ((st-1) % 7) + 1;
  const reward = (D.baseCps*300 + D.baseTap*50 + 100) * day;
  const jelly = day === 7 ? 2 : day === 4 ? 1 : 0;
  gain(reward); S.jelly += jelly; addGems(5*day); merit(100);
  if (tutActive()) return;  // brand-new players: no pop-up before their first tap; the day-1 gift is granted quietly
  const boxes = Array.from({length:7}, (_,i) => `<div class="${i+1 < day ? 'on' : i+1 === day ? 'today' : ''}">${i+1}</div>`).join('');
  showModal(`Party Congress · day ${st} in a row`, '+' + fmt(reward),
    `The delegates rise and applaud. Come back tomorrow for a bigger gift: day 4 adds 1 royal jelly, day 7 adds 2.` + (jelly ? ` Today: +${jelly} royal jelly!` : '') + ` Plus ${5*day} amber and 100 pass merit.`,
    'Accept the gift', `<div class="streak">${boxes}</div>`);
}

function toast(title, text, tone, ic){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (tone||'');
  const fallback = {good:'up', bad:'warn', gold:'crumb', jelly:'drop', medal:'star'}[tone] || 'scroll';
  el.innerHTML = `<div class="ti">${icon(ic || fallback)}</div><div><b></b><span></span></div>`;
  el.querySelector('b').textContent = title; el.querySelector('span').textContent = text;
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3600);
}

function visibleProducers(){
  let maxIdx = 0;
  PRODUCERS.forEach((p,i) => { if ((S.owned[p.id]||0) > 0 || S.run >= p.base*0.6) maxIdx = Math.max(maxIdx, i+1); });
  return Math.min(maxIdx, S.doctrine.expansion ? PRODUCERS.length-1 : 10);
}
function etaText(cost){
  if (cost <= S.crumbs) return 'ready';
  if (D.cps <= 0) return 'tap to earn';
  return 'in ' + fmtTime((cost - S.crumbs) / D.cps);
}
function bestValueId(){
  let best = null, bestPay = Infinity;
  PRODUCERS.slice(0, visibleProducers()+1).forEach(p => {
    const c = costOf(p, S.owned[p.id]||0, 1), pay = c / D.each[p.id];
    if (pay < bestPay){ bestPay = pay; best = p.id; }
  });
  return best;
}

function setRow(row, cost, label){
  const ready = cost <= S.crumbs + 1e-9;
  row.classList.toggle('ready', ready);

  row.querySelector('[data-cost]').textContent = (ready ? 'BUY ' : '') + label;
  row.querySelector('[data-eta]').textContent = etaText(cost);
  row.querySelector('[data-fill]').style.width = Math.min(100, S.crumbs/cost*100) + '%';
}

let hillCompact = false, compactLock = 0, lastListTop = 0, touchY = null;

  if (hillCompact === v) return;

function onListScroll(){
  const t = $('list').scrollTop, up = t < lastListTop; lastListTop = t;

function countAffordable(){
  let c = 0;
  PRODUCERS.slice(0, visibleProducers()+1).forEach(p => { if (costOf(p, S.owned[p.id]||0, 1) <= S.crumbs) c++; });
  const r = availableUpgrades(S).filter(u => upgCost(u) <= S.crumbs).length;
  const e = EDICTS.filter(x => (S.edicts[x.id]||0) < x.max && x.cost(S.edicts[x.id]||0) <= S.jelly).length;
  return {c, r, e};
}
function setTab(id, label, badge){

  if (el.dataset.k === key) return;
  el.dataset.k = key;

}

/* ============================================================
   THE COLONY (canvas)
   ============================================================ */
const colony = (() => {
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0, H=0, dpr=1, bg=null, routes=[], ants=[], floats=[], parts=[], weather=[], queenPulse=0;
  let cube=null, nextCube=performance.now()+40000, eater=null, flyer=null, rubble=null, guard=null, seasonId=null;
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const COL = {loam:C('--loam'), soil:C('--soil'), clay:C('--clay'), tunnel:C('--tunnel'), chalk:C('--chalk'), dust:C('--dust'), crumb:C('--crumb'), banner:C('--banner'), dusk:C('--dusk'), leaf:C('--leaf'), jelly:C('--jelly')};
  const MONO = C('--f-mono'), DISP = C('--f-display');

  const SPOTS = {forager:[.2,.4], aphid:[.8,.38], leaf:[.14,.62], fungus:[.86,.62], tunnel:[.3,.86], beetle:[.7,.86], ministry:[.1,.86], politburo:[.9,.86]};
  const geo = () => {
    const surf = H*0.29, mh = Math.min(H*0.12, 44);
    return {surf, mh, ent:[W*.5, surf-mh*0.8], hub:[W*.5, H*.42], queen:[W*.5, H*.66]};
  };
  function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

  function resize(){
    const r = stage.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height); dpr = Math.min(devicePixelRatio||1, 2);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    rebuild();
  }

  function rebuild(){
    if (!W || !S || !D) return;
    const g = geo(), se = D.season; seasonId = se.id;
    bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
    const b = bg.getContext('2d'); b.setTransform(dpr,0,0,dpr,0,0);
    // ---- Poster hill: flat colour, ink outlines, a sun rising behind the mound ----
    const INK = '#1D1A2B', PAPER = '#FFFBF3';
    const PAL = {
      spring:{sky:'#9ED8F0', ray:'#B9E5F6', sun:'#FFC738', grass:'#3DAA55', mound:'#D88A4E'},
      summer:{sky:'#FFD66B', ray:'#FFE59E', sun:'#E5392D', grass:'#2FA862', mound:'#D88A4E'},
      autumn:{sky:'#F2995A', ray:'#F7B581', sun:'#E5392D', grass:'#C9922E', mound:'#D2803F'},
      winter:{sky:'#BFD2E6', ray:'#D5E2EF', sun:PAPER,     grass:'#F4F7FB', mound:'#C98652'},
    }[se.id] || {sky:'#9ED8F0', ray:'#B9E5F6', sun:'#FFC738', grass:'#3DAA55', mound:'#D88A4E'};
    const top = [W*.5, g.surf - g.mh*1.05];
    b.fillStyle = PAL.sky; b.fillRect(0, 0, W, g.surf);
    // sunburst
    const rays = 18, R = Math.hypot(W, g.surf) * 1.2;
    b.fillStyle = PAL.ray;
    for (let i = 0; i < rays; i += 2){
      const a0 = Math.PI + i/rays*Math.PI, a1 = Math.PI + (i+1)/rays*Math.PI;
      b.beginPath(); b.moveTo(top[0], top[1]); b.lineTo(top[0] + Math.cos(a0)*R, top[1] + Math.sin(a0)*R); b.lineTo(top[0] + Math.cos(a1)*R, top[1] + Math.sin(a1)*R); b.closePath(); b.fill();
    }
    // rising sun behind the hill
    const sunR = Math.min(W*.24, g.surf*.95);
    b.fillStyle = PAL.sun; b.strokeStyle = INK; b.lineWidth = 2.5;
    b.beginPath(); b.arc(top[0], g.surf, sunR, Math.PI, 0); b.closePath(); b.fill(); b.stroke();
    const r = rng(7);
    // flat clouds
    for (let i = 0; i < 3; i++){
      const cx = W*(.1 + i*.38) + r()*W*.08, cy = 10 + r()*g.surf*.32, cw = 30 + r()*24, chh = 11;
      b.fillStyle = PAPER; b.strokeStyle = INK; b.lineWidth = 1.5;
      b.beginPath(); if (b.roundRect) b.roundRect(cx - cw/2, cy, cw, chh, chh/2); else b.rect(cx - cw/2, cy, cw, chh); b.fill(); b.stroke();
    }
    // soil in flat bands
    const bands = ['#C77A45', '#B5693C', '#9D5833', '#82482A'];
    const bh = (H - g.surf) / bands.length;
    bands.forEach((c, i) => { b.fillStyle = c; b.fillRect(0, g.surf + i*bh, W, bh + 1); });
    for (let i = 0; i < 28; i++){ b.fillStyle = 'rgba(29,26,43,.22)'; b.beginPath(); b.ellipse(r()*W, g.surf + 14 + r()*(H - g.surf - 14), 2 + r()*3.5, 1.5 + r()*2, r()*3, 0, Math.PI*2); b.fill(); }
    // grass strip with an ink line
    b.fillStyle = PAL.grass; b.fillRect(0, g.surf - 3, W, 7);
    b.fillStyle = INK; b.fillRect(0, g.surf + 4, W, 2);
    for (let i = 0; i < 40; i++){ const x = r()*W; if (x > W*.27 && x < W*.73) continue; const h = 4 + r()*6; b.fillStyle = PAL.grass; b.beginPath(); b.moveTo(x - 2, g.surf - 2); b.lineTo(x + (r()-.5)*3, g.surf - 2 - h); b.lineTo(x + 2, g.surf - 2); b.closePath(); b.fill(); }
    if (se.id === 'spring') for (let i = 0; i < 12; i++){ const x = r()*W; if (x > W*.27 && x < W*.73) continue; b.fillStyle = r() < .5 ? '#E5392D' : PAPER; b.beginPath(); b.arc(x, g.surf - 6 - r()*4, 2, 0, Math.PI*2); b.fill(); }
    // the mound
    b.fillStyle = PAL.mound; b.strokeStyle = INK; b.lineWidth = 2.5;
    b.beginPath(); b.moveTo(W*.27, g.surf + 2);
    b.bezierCurveTo(W*.37, g.surf - g.mh*1.4, W*.63, g.surf - g.mh*1.4, W*.73, g.surf + 2); b.closePath(); b.fill(); b.stroke();
    if (se.id === 'winter'){
      b.fillStyle = PAPER; b.beginPath(); b.moveTo(W*.34, g.surf - g.mh*.55); b.bezierCurveTo(W*.42, g.surf - g.mh*1.3, W*.58, g.surf - g.mh*1.3, W*.66, g.surf - g.mh*.55);
      b.bezierCurveTo(W*.6, g.surf - g.mh*.8, W*.4, g.surf - g.mh*.8, W*.34, g.surf - g.mh*.55); b.fill(); b.stroke();
    }
    // the flag on top
    const fx = W*.5 + 12, fy = g.surf - g.mh*1.02;
    b.strokeStyle = INK; b.lineWidth = 2; b.beginPath(); b.moveTo(fx, fy); b.lineTo(fx, fy - 24); b.stroke();
    b.fillStyle = '#E5392D'; b.beginPath(); b.moveTo(fx, fy - 24); b.lineTo(fx + 17, fy - 21); b.lineTo(fx, fy - 14); b.closePath(); b.fill(); b.lineWidth = 1.5; b.stroke();
    b.fillStyle = '#FFC738'; b.beginPath(); b.arc(fx + 5, fy - 19.5, 1.6, 0, Math.PI*2); b.fill();

    routes = [];
    const owned = S.owned;
    const tw = Math.max(8, Math.min(W,H)*0.038);
    const tunnels = [];
    const tun = pts => tunnels.push(pts);
    routes.push(mkRoute([g.ent, [W*.36, g.surf-3], [-10, g.surf-3]], true));
    routes.push(mkRoute([g.ent, [W*.64, g.surf-3], [W+10, g.surf-3]], true));
    tun([g.ent, g.hub]);
    tun([g.hub, g.queen]);
    routes.push(mkRoute([g.ent, g.hub, g.queen], false));
    const chambers = [];
    PRODUCERS.forEach(p => {
      const sp = SPOTS[p.id]; if (!sp || !(owned[p.id] > 0)) return;
      const c = [W*sp[0], H*sp[1]];
      const elbow = [ (g.hub[0]+c[0])/2, c[1] < g.hub[1] ? g.hub[1] : (g.hub[1]+c[1])/2 ];
      tun([g.hub, elbow, c]);
      routes.push(mkRoute([g.ent, g.hub, elbow, c], false));
      chambers.push({p, c});
    });
    const rx = Math.min(W*.085, 44), ry = Math.min(H*.06, 22);
    const path = pts => { b.beginPath(); b.moveTo(...pts[0]); for (const q of pts.slice(1)) b.lineTo(...q); };
    const blobs = [[g.queen, rx*1.35, ry*1.35], ...chambers.map(ch => [ch.c, rx, ry])];
    // pass 1: ink outlines for every tunnel and chamber; pass 2: sand fills on top, so joints stay seamless
    b.lineCap = 'round'; b.lineJoin = 'round';
    b.strokeStyle = INK; b.lineWidth = tw + 5; for (const t of tunnels){ path(t); b.stroke(); }
    b.fillStyle = INK; for (const [c, ex, ey] of blobs){ b.beginPath(); b.ellipse(c[0], c[1], ex + 2.5, ey + 2.5, 0, 0, Math.PI*2); b.fill(); }
    b.strokeStyle = COL.tunnel; b.lineWidth = tw; for (const t of tunnels){ path(t); b.stroke(); }
    b.fillStyle = COL.tunnel; for (const [c, ex, ey] of blobs){ b.beginPath(); b.ellipse(c[0], c[1], ex, ey, 0, 0, Math.PI*2); b.fill(); }
    const pill = (txt, x, y, bgc, fg) => {
      b.font = `800 8.5px ${MONO}`; b.textAlign = 'center'; b.textBaseline = 'middle';
      const w = b.measureText(txt).width + 10, h = 13;
      b.fillStyle = bgc; b.strokeStyle = INK; b.lineWidth = 1.5;
      b.beginPath(); if (b.roundRect) b.roundRect(x - w/2, y - h/2, w, h, h/2); else b.rect(x - w/2, y - h/2, w, h); b.fill(); b.stroke();
      b.fillStyle = fg; b.fillText(txt, x, y + .5); b.textBaseline = 'alphabetic';
    };
    chambers.forEach(({p, c}, i) => {
      const rr = rng((i+1)*97 + 3), n = owned[p.id];
      for (let k = 0; k < Math.min(n, 14); k++){ const a = rr()*Math.PI*2, d = rr(); b.fillStyle = p.color; b.strokeStyle = INK; b.lineWidth = 1; b.beginPath(); b.arc(c[0] + Math.cos(a)*rx*.62*d, c[1] + ry*.15 + Math.sin(a)*ry*.4*d, 2.6, 0, Math.PI*2); b.fill(); b.stroke(); }
      pill(p.short + ' ' + n, c[0], Math.min(c[1] + ry + 10, H - 9), PAPER, INK);   // keep bottom-row labels inside the hill
    });
    // the queen's chamber
    b.strokeStyle = '#E5392D'; b.lineWidth = 2; b.setLineDash([4, 3]); b.beginPath(); b.ellipse(g.queen[0], g.queen[1], rx*1.1, ry*1.05, 0, 0, Math.PI*2); b.stroke(); b.setLineDash([]);
    pill('HER MAJESTY THE PEOPLE', g.queen[0], g.queen[1] - ry*1.35 - 9, '#E5392D', '#FFFFFF');
    if (owned.orbit > 0){
      const ox = W*.86, oy = g.surf*.4;
      b.strokeStyle = '#9fc3d6'; b.lineWidth = 1.5; b.beginPath(); b.ellipse(ox, oy, 16, 5, -.3, 0, Math.PI*2); b.stroke();
      b.fillStyle = COL.soil; b.beginPath(); b.arc(ox, oy, 7, Math.PI, 0); b.fill();
      b.fillStyle = 'rgba(255,248,236,.95)'; b.font = `600 9px ${MONO}`; b.textAlign='center'; b.fillText('ORBIT ' + owned.orbit, ox, oy+18);
    }
    if (owned.comintern > 0){
      for (const fx of [W*.06, W*.94]){

    const g = geo(), t = performance.now();
    const spots = [[W*.36, H*.5], [W*.64, H*.5], [W*.5, (g.hub[1]+g.queen[1])/2]];
    const sp = spots[Math.floor(Math.random()*spots.length)];
    rubble = {x: sp[0], y: sp[1], hp:8, max:8, until: t + 8000, hurt:0};
  }
  function busy(){ return !!(eater || flyer || rubble || guard); }
  function spawnCube(){ const g = geo(); cube = {x: W*(.15 + Math.random()*.7), y: g.surf - 12 - Math.random()*g.surf*.35, born: performance.now()}; }
  function hasCube(){ return !!cube; }
  function hasFlyer(){ return !!flyer; }

  new ResizeObserver(resize).observe(stage);
  return {frame, rebuild, tapAt, reset, resize, droneTap, autoTap, spawnAnteater, spawnFlyer, spawnRubble, busy, spawnCube, hasCube, hasFlyer, spawnGuardian, guardianActive: () => !!guard, hitGuardian: v => hitGuardian(v)};
})();

/* ============================================================
   MAIN LOOP & BOOT
   ============================================================ */
let lastSave = 0, lastUi = 0, lastFrame = performance.now();
function loop(t){
  const now = Date.now();
  const el = (now - S.last) / 1000; S.last = now;
  const dt = Math.min(.25, (t - lastFrame)/1000); lastFrame = t;
  if (el > 15){
    D = derive(S, now);
    const secs = Math.min(el, D.offlineCap);
    const g = D.baseCps * secs * D.offline;
    if (g > 0){
      gain(g);
      const back = raidsReady();
      pendingOffline = g;
      const adBtn = `<button class="gbtn ad big" id="m-ad2">${icon(adFree() ? 'star' : 'play')}${S.iap.owned.party ? 'Party bonus' : !PLATFORM.ads ? 'Night bonus' : 'Watch an ad'}: double it to +${fmt(g*2)}</button>`;
      showModal('The night shift reports', '+' + fmt(g),
        `You were away for ${fmtTime(el)}${el > D.offlineCap ? ` (the shift covers ${D.offlineCap/3600}h at most)` : ''}. The colony kept gathering at ${Math.round(D.offline*100)}% speed.` + (D.offline < 1 ? ' Research Night Shift to bring that to 100%.' : '') + (back ? ` ${back} raiding squad${back>1?'s are':' is'} home with loot.` : ''), null, adBtn);
    }
    scheduleNextEvent();
  } else if (el > 0) gain(D.cps * el);
  if (el > 0) siege(el);

  if (t - lastTapAt > 600) fervor = Math.max(0, fervor - dt * .35 * D.ferDecay);
  if (t < fervorLockUntil) fervor = 1;
  const ar = autoTapRate(now);
  if (ar){
    autoAcc += ar * dt;
    while (autoAcc >= 1){ autoAcc--;
      if (colony.guardianActive()) colony.hitGuardian(hooks.guardianHit());
      else { const v = doTap(true); colony.autoTap(v, lastCrit); }
    }
  } else autoAcc = 0;
  if (D.drones){
    droneAcc += D.drones * dt;
    while (droneAcc >= 1){ droneAcc--; const v = D.tapValue; if (colony.guardianActive()) colony.hitGuardian(v * D.abyssMult); else { gain(v); colony.droneTap(v); } }
  }

  colony.frame(t);
  $('stage').classList.toggle('fighting', colony.guardianActive());
  $('crumbs').textContent = fmt(S.crumbs);
  const fv = $('fervor');
  if (S.taps >= 5){ $('hint').hidden = true; fv.hidden = false; }
  $('ferv-fill').style.width = (fervor*100) + '%';
  fv.classList.toggle('max', fervor > .98);
  $('ferv-lbl').textContent = (fervor > .98 ? 'MAX FERVOR ×' : 'FERVOR ×') + fervMult().toFixed(1);

  if (t - lastUi > 200){
    lastUi = t;
    D = derive(S, now);
    S.buffs = S.buffs.filter(b => b.until > now);
    const se = D.season;
    S.flags.seasons[se.id] = 1;
    if (lastSeason && lastSeason !== se.id){
      toast(`${se.name} has come`, `For the next 4 minutes: ${(se.id==='winter' && D.almanac) ? 'lab −20%' : se.fx}.`, se.id==='winter' ? 'neutral' : 'good', se.icon);
    }
    lastSeason = se.id;
    if (activeEvent){
      const left = (eventDeadline - now) / 25000;
      $('sh-fill').style.width = Math.max(0, left*100) + '%';
      $('sh-clock').textContent = Math.max(0, Math.ceil((eventDeadline - now)/1000)) + 's';
      if (left <= 0) resolveEvent('b', true);
    } else if (now > nextEventAt && $('modal').hidden && $('opening').hidden && !colony.busy()){
      fireEvent();
    }
    checkMedals(); checkDirectives();
    checkHardship(); automate(t); checkPassSeason(); Fun.tick(now);
    Online.tick(now);
    refresh();
  }
  if (t - lastSave > 5000){ lastSave = t; save(); }
  requestAnimationFrame(loop);
}

function start(data){
  S = (data && data.state) ? normalize(data.state) : (load() || fresh());
  D = derive(S);
  checkPassSeason();
  initTut();
  if (tutActive()) nextEventAt = Date.now() + 90000;
  if (!S.quota) genQuota();
  buildTicker();
  render();
  colony.resize();
  checkDaily();
  initMilestones();
  $('advisor').querySelector('.adv-face').innerHTML = antFaceSVG();
  Analytics.ev('session_start', {tut: tutStep(), gems: Math.floor(S.gems), pass_premium: !!S.pass.premium});
  if (!S.flags.v4){
    S.flags.v4 = true; S.gems += 50; S.packs.common = (S.packs.common||0) + 1;
    S.inv.rush = (S.inv.rush||0) + 1; S.inv.basket = (S.inv.basket||0) + 1;
    showModal('A gift from the Politburo', '+50 amber', 'Amber buys card packs, usables and the Revolution Pass in the Shop. You also got a free Worker Pack (open it in Cards) and two usables on your belt.', 'Glory to the hill');
    save();
  }

  const stage = $('stage');
  stage.addEventListener('pointerdown', e => {
    const r = stage.getBoundingClientRect();
    colony.tapAt(e.clientX - r.left, e.clientY - r.top);
    $('crumbs').textContent = fmt(S.crumbs);
  });
  stage.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); const r = stage.getBoundingClientRect(); colony.tapAt(r.width/2, r.height*.6); }
  });
  $('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-group]'); if (!b) return;
    const g = b.dataset.group, G = GROUPS[g];
    const t = lastIn[g] !== undefined && tabShown(lastIn[g]) ? lastIn[g] : G.tabs.find(tabShown);
    G.tabs.forEach(x => freshTabs.delete(x)); goTab(t);
  });
  $('groupbar').addEventListener('click', e => { const b = e.target.closest('[data-gt]'); if (!b) return; const [t, sc] = b.dataset.gt.split(':'); goTab(t, sc); });
  $('flightbtn').addEventListener('click', () => goTab('flight'));
  $('subbar').addEventListener('click', onPanelClick);
  $('m-extra').addEventListener('click', async e => {
    const sh = e.target.closest('[data-share]'); if (sh){ shareColony(sh.dataset.share); return; }
    const b = e.target.closest('#m-ad2'); if (b && !b.disabled){ doubleOffline(b); return; }
    if (e.target.closest('#m-kit')){ await buyIAP('starter'); if (S.iap.owned.starter) $('m-ok').click(); }
  });
  $('list').addEventListener('click', onPanelClick);
  $('list').addEventListener('scroll', onListScroll, {passive:true});
  $('list').addEventListener('wheel', e => { if (e.deltaY < 0) expandAtTop(); }, {passive:true});
  $('list').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
  $('list').addEventListener('touchmove', e => { if (touchY !== null && e.touches[0].clientY - touchY > 40) expandAtTop(); }, {passive:true});
  $('list').addEventListener('touchend', () => { touchY = null; }, {passive:true});
  $('list').addEventListener('keydown', e => {   // Enter in a league field presses its button
    if (e.key !== 'Enter' || !e.target.classList.contains('oinput')) return;
    e.preventDefault(); const b = e.target.parentElement.querySelector('[data-on]'); if (b && !b.disabled) b.click();
  });
  $('m-ok').addEventListener('click', () => { $('modal').hidden = true; if (modalQ.length) showModal(...modalQ.shift()); refresh(); });
  $('belt').addEventListener('click', e => {
    const u = e.target.closest('[data-use]'); if (u){ if (useItem(u.dataset.use)){ afterChange(); } return; }
    const go = e.target.closest('[data-goto]'); if (go){ tab = go.dataset.goto; render(); $('list').scrollTop = 0; }
  });
  $('quota').addEventListener('click', e => { const go = e.target.closest('[data-goto]'); if (go){ tab = go.dataset.goto; freshTabs.delete(tab); render(); $('list').scrollTop = 0; } });
  $('gempill').addEventListener('click', () => { tab = 'shop'; render(); $('list').scrollTop = 0; });
  $('op-cards').addEventListener('click', e => flipCard(e.target.closest('.flip')));
  $('op-all').addEventListener('click', () => document.querySelectorAll('#op-cards .flip:not(.open)').forEach((el,i) => setTimeout(() => flipCard(el), i*160)));
  $('op-done').addEventListener('click', () => { $('opening').hidden = true; D = derive(S); save(); render(); colony.rebuild(); });
  $('sh-a').addEventListener('click', () => resolveEvent('a'));
  $('sh-b').addEventListener('click', () => resolveEvent('b'));
  $('snd').addEventListener('click', () => { S.sound = !S.sound; save(); refresh(); if (S.sound) Sound.buy(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden){ save(true); Analytics.flush(); } });
  $('spinpill').addEventListener('click', e => { e.stopPropagation(); Fun.openSpin(); });
  $('spinpill').addEventListener('pointerdown', e => e.stopPropagation());
  $('advisor').addEventListener('pointerdown', e => e.stopPropagation());
  $('advisor').addEventListener('click', e => { e.stopPropagation(); const go = $('advisor').dataset.go; Fun.hideAdvisor(); if (go === 'pass'){ goTab('pass'); } else if (go === 'ranks'){ goTab('ranks'); } else if (go === 'shop'){ goTab('shop'); } else if (go){ goTab(go); } });
  $('spin-btn').addEventListener('click', () => Fun.spin());
  $('pol-web').addEventListener('click', () => openExternal(PLATFORM.privacyUrl));
  $('policyov').addEventListener('click', e => { if (e.target.id === 'policyov' || e.target.closest('#pol-close')) $('policyov').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('policyov').hidden) $('policyov').hidden = true; });
  $('spin-close').addEventListener('click', () => { if (!Fun.spinBusy){ $('spinov').hidden = true; refresh(); } });
  addEventListener('pagehide', () => save(true));
  Native.post('ready', {});                                    // shell answers with local store prices
  if (PLATFORM.achievements) S.medals.forEach(id => Monetize.achievement(id));   // re-sync medals earned earlier

  try { document.fonts && document.fonts.ready.then(() => colony.rebuild()); } catch(e){}
  window.claude?.hot?.snapshot?.(() => ({state:S}));
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
