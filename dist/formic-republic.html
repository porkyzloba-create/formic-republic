<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Formic Republic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone app. Propaganda ticker, larder counter, stamped Plan quota, a living cross-section of the hill you tap, then the Bureau panel with five tabs. Single underground (dark) look by choice. */
:root{
  color-scheme: dark;
  --loam:#1b1410;      /* page ground: deep soil */
  --soil:#271d16;      /* panels */
  --soil-hi:#30241b;
  --clay:#3d2e23;      /* rules, tunnels */
  --tunnel:#4d3a2c;
  --chalk:#f1e7d8;     /* text */
  --dust:#a9988a;      /* muted text */
  --crumb:#f0b13c;     /* accent: food, "you can buy this" */
  --crumb-deep:#a8701c;
  --crumb-wash:rgba(240,177,60,.10);
  --banner:#c9372a;    /* propaganda red: prestige, danger */
  --banner-deep:#8e2219;
  --leaf:#93b65c;      /* good news */
  --dusk:#3a2f3f;      /* sky above the hill */
  --jelly:#e4c8f0;     /* royal jelly */
  --f-display:'Big Shoulders Stencil Display', Impact, 'Arial Narrow', sans-serif;
  --f-body:'Archivo', system-ui, -apple-system, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:var(--loam);color:var(--chalk);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--crumb);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 12px;gap:8px}

.ticker{flex:none;overflow:hidden;white-space:nowrap;background:var(--banner);color:var(--chalk);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-block:5px;border-radius:2px}
.ticker-track{display:inline-block;animation:marquee 90s linear infinite}
.ticker-track span{padding-inline:14px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bank{min-width:0}
.bank-num{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,56px);line-height:.9;color:var(--crumb);font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:left bottom}
.bank-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dust);margin-top:4px}
.rates{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.rates b{color:var(--chalk);font-weight:600}
.rates b.boost{color:var(--leaf)}
.rates b.slump{color:var(--banner)}
.rates .muted{color:var(--dust)}
.pher-chip{color:var(--banner);font-weight:600}
.snd{background:none;border:1px solid var(--clay);border-radius:20px;padding:2px 9px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dust);cursor:pointer;display:inline-flex;gap:5px;align-items:center}

/* Plan quota: a stamped ticket */
.quota{position:relative;flex:none;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--soil);border-radius:6px;padding:8px 10px 8px 8px;overflow:hidden}
.q-stamp{width:44px;height:44px;border-radius:50%;border:2px solid var(--banner);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);color:var(--banner);font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.12em;line-height:1;box-shadow:inset 0 0 0 2px var(--soil),inset 0 0 0 3px rgba(201,55,42,.5)}
.q-stamp b{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:0;margin-top:1px}
.q-body{min-width:0;display:flex;flex-direction:column;gap:5px}
.q-top{display:flex;align-items:baseline;gap:8px;font-size:12px;min-width:0}
.q-text{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-count{font-family:var(--f-mono);font-size:11px;color:var(--dust);font-variant-numeric:tabular-nums;flex:none}
.q-bar{height:6px;background:var(--clay);border-radius:3px;overflow:hidden}
.q-bar div{height:100%;background:repeating-linear-gradient(-45deg,var(--banner) 0 6px,var(--banner-deep) 6px 12px);width:0;transition:width .25s;border-radius:3px}
.q-reward{font-family:var(--f-mono);font-size:10px;color:var(--dust);display:flex;gap:8px;flex-wrap:wrap}
.q-reward b{color:var(--crumb);font-weight:600}
.q-reward .j{color:var(--jelly)}
.q-done{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.q-done span{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.08em;color:var(--banner);border:3px solid var(--banner);padding:0 12px;border-radius:4px;transform:rotate(-6deg);background:rgba(39,29,22,.85)}
.quota.stamped .q-done{animation:stamp 1.6s ease-out}
@keyframes stamp{0%{opacity:0;transform:scale(2.2)}15%{opacity:1;transform:scale(.95)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

.stage{position:relative;flex:1 1 34%;min-height:170px;border-radius:6px;overflow:hidden;background:var(--soil);touch-action:manipulation;cursor:pointer}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);background:rgba(27,20,16,.78);padding:5px 10px;border-radius:20px;pointer-events:none;white-space:nowrap}
.buffs{position:absolute;top:8px;left:8px;max-width:calc(100% - 150px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.buff{position:relative;max-width:100%;display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:4px 8px 5px 6px;border-radius:12px;background:rgba(27,20,16,.88);color:var(--leaf);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(147,182,92,.45)}
.buff.bad{color:var(--banner);box-shadow:inset 0 0 0 1px rgba(201,55,42,.5)}
.buff.gold{color:var(--crumb);box-shadow:inset 0 0 0 1px rgba(240,177,60,.55)}
.buff svg{font-size:12px}
.buff i{position:absolute;left:0;bottom:0;height:2px;width:100%;background:currentColor;transform-origin:left;transform:scaleX(var(--p,1))}
.buff em{font-style:normal;opacity:.75;font-weight:500}
.season{position:absolute;top:8px;right:8px;display:grid;grid-template-columns:auto auto;align-items:center;gap:0 6px;padding:4px 9px;border-radius:9px;text-align:right;background:rgba(27,20,16,.85);font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--chalk);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.season svg{font-size:15px;grid-row:span 2}
.season em{font-style:normal;color:var(--dust);font-weight:500;font-size:9px;letter-spacing:.02em}
.fervor{position:absolute;left:10px;right:10px;bottom:9px;display:flex;align-items:center;gap:8px;pointer-events:none}
.fervor .lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--chalk);background:rgba(27,20,16,.8);padding:2px 7px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
.fervor .track{flex:1;height:7px;background:rgba(27,20,16,.85);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(241,231,216,.08)}
.fervor .track div{height:100%;width:0;background:linear-gradient(90deg,var(--crumb),#f27a2c 60%,var(--banner));border-radius:4px}
.fervor.max .lbl{color:var(--crumb);animation:glow .6s ease-in-out infinite alternate}
.fervor.max .track{box-shadow:0 0 10px rgba(240,120,44,.6)}
@keyframes glow{from{text-shadow:0 0 0 transparent}to{text-shadow:0 0 8px var(--crumb)}}

.panel{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;background:var(--soil);border-radius:6px;overflow:hidden}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--clay)}
.tab{position:relative;min-width:0;background:none;border:0;padding:11px 1px 8px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--dust);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--crumb)}
.tab[data-tab="flight"][aria-selected="true"]{border-bottom-color:var(--banner)}
.badge{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;box-shadow:0 0 0 2px var(--soil);background:var(--crumb);color:var(--loam);font-family:var(--f-mono);font-size:9px;font-weight:600;line-height:15px;letter-spacing:0;animation:pop .4s ease-out}
.badge.red{background:var(--banner);color:var(--chalk)}
.badge.jelly{background:var(--jelly)}
.badge.go{background:var(--leaf)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.subbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--clay);font-size:12px;color:var(--dust)}
.subbar b{color:var(--crumb);font-weight:600}
.seg{display:flex;border:1px solid var(--clay);border-radius:4px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:4px 10px;font-family:var(--f-mono);font-size:12px;color:var(--dust);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--crumb);color:var(--loam);font-weight:600}
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--clay);padding:11px 12px 13px;cursor:pointer;transition:background .2s}
.row.ready{background:var(--crumb-wash)}
.row.ready:active{background:rgba(240,177,60,.22)}
.row:not(.ready){cursor:default}
.row:not(.ready) .row-name{color:var(--dust)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.08em;padding:2px 5px;border-radius:3px;background:var(--leaf);color:var(--loam)}
.row-target{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.row-sub{font-size:12px;color:var(--dust);font-style:italic}
.row-meta{font-family:var(--f-mono);font-size:11px;color:var(--dust);font-variant-numeric:tabular-nums}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.owned{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.price{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--dust);white-space:nowrap;font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:3px;border:1px solid var(--clay)}
.row.ready .price{background:var(--crumb);border-color:var(--crumb);color:var(--loam);animation:ready 1.8s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 0 0 0 rgba(240,177,60,0)}50%{box-shadow:0 0 0 4px rgba(240,177,60,.18)}}
.eta{font-family:var(--f-mono);font-size:10px;color:var(--dust);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.ready .eta{color:var(--crumb)}
.fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--crumb);opacity:.55;transition:width .2s linear}
.row.ready .fill{opacity:1}
.locked{padding:12px;font-size:12px;color:var(--dust);border-bottom:1px solid var(--clay)}
.locked b{color:var(--chalk);font-weight:600}

/* Raids */
.raid{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--clay)}
.raid.done{background:var(--crumb-wash)}
.raid.off{opacity:.55}
.raid-head{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.raid-icon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--clay);color:var(--crumb);font-size:20px}
.raid.away .raid-icon{color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:10px;background:var(--loam);color:var(--dust);font-variant-numeric:tabular-nums}
.chip svg{font-size:11px}
.chip.j{color:var(--jelly)}
.chip.c{color:var(--crumb)}
.raid-act .btn{width:100%;font-size:17px;padding:9px}
.prog{display:flex;flex-direction:column;gap:4px}
.prog-bar{height:8px;background:var(--loam);border-radius:4px;overflow:hidden}
.prog-bar div{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--leaf) 0 6px,#7a9c47 6px 12px);border-radius:4px;animation:march 1s linear infinite;background-size:17px 17px}
@keyframes march{to{background-position:17px 0}}
.prog-txt{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--dust);font-variant-numeric:tabular-nums}

/* Medals */
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 12px}
.medal{position:relative;isolation:isolate;display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center;padding:12px 9px 9px;border-radius:6px;background:var(--soil-hi);min-width:0}
.disc{position:relative;width:34px;height:34px;margin-top:6px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle at 35% 30%,#5a4a3e,#3a2e25 60%,#2a211a);color:#6e5d4f;box-shadow:inset 0 0 0 2px rgba(0,0,0,.3),inset 0 0 0 4px rgba(255,255,255,.04)}
.disc::before{content:'';position:absolute;top:-11px;left:10px;width:14px;height:13px;background:repeating-linear-gradient(90deg,#4a3d33 0 4px,#5a4a3e 4px 5px);clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);z-index:-1}
.medal.won .disc{background:radial-gradient(circle at 35% 30%,#ffe7ad,var(--crumb) 45%,var(--crumb-deep));color:#6b4510;box-shadow:inset 0 0 0 2px rgba(107,69,16,.4),0 2px 8px rgba(240,177,60,.25);overflow:visible}
.medal.won .disc::before{background:repeating-linear-gradient(90deg,var(--banner) 0 4px,var(--chalk) 4px 5px)}
.medal.won .disc::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,70%{background-position:150% 0}100%{background-position:-100% 0}}
.mn{font-weight:700;font-size:12px;line-height:1.2}
.medal:not(.won) .mn{color:var(--dust)}
.mr{font-size:11px;color:var(--dust);line-height:1.3;margin-top:2px}
.mp{height:3px;background:var(--loam);border-radius:2px;margin-top:5px;overflow:hidden}
.mp div{height:100%;background:var(--crumb);opacity:.7}

.flight{padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.flight h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;color:var(--banner);text-wrap:balance}
.flight h3{margin:6px 0 0;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;text-transform:uppercase;color:var(--jelly)}
.flight p{margin:0;font-size:13px;line-height:1.5;color:var(--dust);max-width:60ch}
.flight p b{color:var(--chalk)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;margin:0}
.ledger dt{color:var(--dust)}
.ledger dd{margin:0;text-align:right;color:var(--chalk)}
.ledger .big{color:var(--banner);font-weight:600}
.edicts{display:flex;flex-direction:column;border-top:1px solid var(--clay);margin-inline:-12px}
.edict .price{color:var(--jelly)}
.row.edict.ready{background:rgba(228,200,240,.08)}
.row.edict.ready .price{background:var(--jelly);border-color:var(--jelly);color:var(--loam);animation:none}
.row.edict.maxed .price{border-color:transparent;color:var(--leaf)}
.lvl{display:flex;gap:3px;margin-top:3px}
.lvl i{width:12px;height:4px;border-radius:2px;background:var(--clay)}
.lvl i.on{background:var(--jelly)}
.btn{border:0;border-radius:4px;padding:13px 14px;font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--banner);color:var(--chalk)}
.btn[disabled]{background:var(--clay);color:var(--dust);cursor:default}
.btn.confirm,.btn.gold{background:var(--crumb);color:var(--loam)}
.btn.go{background:var(--leaf);color:var(--loam)}
.btn.ghost{background:none;border:1px solid var(--clay);color:var(--dust);font-size:15px;padding:9px}

.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,7,5,.75);padding:16px;z-index:20}
.card{width:100%;max-width:360px;background:var(--soil);border:1px solid var(--clay);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;animation:rise2 .35s ease-out}
@keyframes rise2{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.card-band{background:var(--banner);color:var(--chalk);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 18px}
.card-body{padding:18px;display:flex;flex-direction:column;gap:12px}
.card .amount{font-family:var(--f-display);font-weight:900;font-size:48px;line-height:.95;color:var(--crumb)}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--dust)}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.streak div{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--loam);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;color:var(--clay)}
.streak div.on{background:var(--crumb);color:var(--loam)}
.streak div.today{background:var(--banner);color:var(--chalk);box-shadow:0 0 0 2px var(--chalk)}

/* Incident sheet: a red-banded report with a burning fuse */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));width:calc(100% - 32px);max-width:528px;z-index:15;background:var(--soil);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px var(--banner),0 16px 50px rgba(0,0,0,.7);animation:rise .35s ease-out}
@keyframes rise{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sh-band{display:flex;justify-content:space-between;align-items:center;background:var(--banner);padding:6px 12px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sh-band span:last-child{font-variant-numeric:tabular-nums}
.sh-body{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px 4px;align-items:start}
.sh-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--loam);color:var(--crumb);font-size:26px;box-shadow:inset 0 0 0 2px var(--clay)}
.sh-title{font-family:var(--f-display);font-weight:900;font-size:25px;line-height:1;text-transform:uppercase;text-wrap:balance}
.sheet p{margin:5px 0 0;font-size:13px;line-height:1.45;color:var(--dust)}
.sh-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 12px}
.sh-actions .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;font-size:18px}
.sh-actions .btn small{font-family:var(--f-body);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;opacity:.85}
.sh-actions .btn.ghost{color:var(--chalk);background:var(--soil-hi);border-color:var(--clay)}
.fuse{position:relative;height:4px;background:var(--loam)}
.fuse div{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--banner-deep),var(--crumb))}
.fuse div::after{content:'';position:absolute;right:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff6d8,var(--crumb) 40%,transparent 70%);animation:spark .15s steps(2) infinite}
@keyframes spark{50%{transform:scale(1.4)}}

/* Toasts with an icon disc and a draining timer line */
.toasts{position:absolute;left:8px;right:8px;bottom:30px;display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none}
.toast{position:relative;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;background:var(--soil-hi);border-radius:8px;padding:8px 12px 9px 8px;box-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 0 0 1px var(--clay);animation:drop .3s ease-out;overflow:hidden}
.toast .ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--clay);color:var(--chalk)}
.toast b{display:block;font-family:var(--f-display);font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.toast span{display:block;font-size:12px;color:var(--dust);line-height:1.35;margin-top:1px}
.toast::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--tc,var(--dust));transform-origin:left;animation:drain 3.6s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.toast.good{--tc:var(--leaf)} .toast.good b{color:var(--leaf)} .toast.good .ti{background:var(--leaf);color:var(--loam)}
.toast.bad{--tc:var(--banner)} .toast.bad b{color:var(--banner)} .toast.bad .ti{background:var(--banner)}
.toast.gold{--tc:var(--crumb)} .toast.gold b{color:var(--crumb)} .toast.gold .ti{background:var(--crumb);color:var(--loam)}
.toast.jelly{--tc:var(--jelly)} .toast.jelly b{color:var(--jelly)} .toast.jelly .ti{background:var(--jelly);color:var(--loam)}
.toast.medal{--tc:var(--crumb)} .toast.medal b{color:var(--crumb)} .toast.medal .ti{background:radial-gradient(circle at 35% 30%,#ffe7ad,var(--crumb) 45%,var(--crumb-deep));color:#6b4510}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}


/* ===== v4: amber, belt, cards, pack opening, shop, pass ===== */
:root{--r-c:#b7a594;--r-r:#5aa0e0;--r-e:#b77be0;--r-l:#f0b13c;--gem:#ff9f43}
.tabs{grid-template-columns:repeat(8,1fr)}
.tab{flex-direction:column;gap:3px;font-size:10px;letter-spacing:0;padding:8px 0 6px}
.tab span{max-width:100%;overflow:hidden;text-overflow:clip}
.tab svg{font-size:18px}
.badge{top:3px;right:calc(50% - 21px)}
.btn.gold[disabled]{background:var(--clay);color:var(--dust)}
.gem-pill{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#3a2614,#2a1b0e);border:1px solid rgba(255,159,67,.45);border-radius:20px;padding:2px 9px 2px 6px;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--gem);cursor:pointer;font-variant-numeric:tabular-nums}
.gem-pill svg{font-size:13px;filter:drop-shadow(0 0 4px rgba(255,159,67,.7))}
.gem-pill.bump{animation:gempop .5s ease-out}
@keyframes gempop{40%{transform:scale(1.2)}}

.belt{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:34px;align-items:center}
.belt::-webkit-scrollbar{display:none}
.use{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--soil);border:1px solid var(--clay);border-radius:17px;padding:4px 6px 4px 4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.use .ui{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--loam);color:var(--crumb);font-size:13px;box-shadow:inset 0 0 0 1px rgba(240,177,60,.4)}
.use b{font-family:var(--f-mono);font-size:10px;color:var(--loam);background:var(--crumb);border-radius:8px;padding:0 5px;line-height:16px}
.use:active{transform:scale(.95)}
.belt-empty{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dust);font-family:var(--f-mono);letter-spacing:.04em;background:none;border:1px dashed var(--clay);border-radius:17px;padding:7px 12px;cursor:pointer;white-space:nowrap}

.ccard{position:relative;aspect-ratio:5/7;border-radius:8px;padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:linear-gradient(170deg,var(--soil-hi),var(--loam));box-shadow:inset 0 0 0 2px var(--rc),0 4px 14px rgba(0,0,0,.4);overflow:hidden;min-width:0}
.ccard::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 62%);pointer-events:none}
.ccard .rl{position:relative;font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.ccard .ci{position:relative;width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--loam);box-shadow:inset 0 0 0 2px var(--rc);color:var(--rc);font-size:22px}
.ccard .cn{position:relative;font-family:var(--f-display);font-weight:900;font-size:13px;line-height:1;text-transform:uppercase;text-wrap:balance}
.ccard .cf{position:relative;font-size:9.5px;line-height:1.25;color:var(--dust)}
.ccard .cl{position:relative;margin-top:auto;display:flex;gap:2px}
.ccard .cl i{width:6px;height:3px;border-radius:1px;background:var(--clay)}
.ccard .cl i.on{background:var(--rc)}
.ccard.L{box-shadow:inset 0 0 0 2px var(--rc),0 0 18px rgba(240,177,60,.35)}
.ccard.L::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.28) 50%,transparent 70%);background-size:250% 100%;animation:shine 3.5s ease-in-out infinite;pointer-events:none}
.ccard.unknown{background:var(--loam);box-shadow:inset 0 0 0 2px var(--clay)}
.ccard.unknown::before,.ccard.unknown::after{display:none}
.ccard.unknown .ci{color:var(--clay);box-shadow:inset 0 0 0 2px var(--clay)}
.ccard.unknown .cn{color:var(--clay)}
.ccard.unknown .cf{color:#6e5d4f}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;padding:12px}
.packbar{display:flex;gap:8px;padding:12px 12px 0;flex-wrap:wrap}
.packbtn{display:flex;align-items:center;gap:9px;background:var(--soil-hi);border:0;box-shadow:inset 0 0 0 1px var(--clay);border-radius:8px;padding:8px 12px 8px 8px;cursor:pointer;font-weight:700;text-align:left;animation:ready 1.8s ease-in-out infinite}
.packbtn small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--crumb);font-weight:600}
.pk{flex:none;width:28px;height:38px;border-radius:4px;background:linear-gradient(160deg,var(--rc),color-mix(in srgb,var(--rc) 35%,#000));display:grid;place-items:center;color:var(--loam);font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 3px 8px rgba(0,0,0,.4)}

.opening{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 40%,#3a2614,rgba(10,7,5,.97) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px}
.op-title{font-family:var(--f-display);font-weight:900;font-size:32px;text-transform:uppercase;letter-spacing:.04em;color:var(--chalk);text-align:center;line-height:1}
.op-sub{font-family:var(--f-mono);font-size:11px;color:var(--dust);letter-spacing:.1em;text-transform:uppercase;margin-top:-10px}
.op-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;max-width:520px;width:100%}
.flip{width:min(30%,128px);aspect-ratio:5/7;perspective:800px;cursor:pointer;animation:deal .45s ease-out backwards}
@keyframes deal{from{transform:translateY(50px) rotate(-8deg);opacity:0}}
.flip-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .front .ccard{height:100%}
.flip .back{border-radius:8px;background:repeating-linear-gradient(45deg,var(--banner) 0 8px,var(--banner-deep) 8px 16px);box-shadow:inset 0 0 0 3px var(--crumb),0 6px 18px rgba(0,0,0,.5);display:grid;place-items:center;color:var(--crumb);font-size:34px}
.flip:not(.open):hover .back{filter:brightness(1.15)}
.flip.open.R .front{filter:drop-shadow(0 0 10px rgba(90,160,224,.65))}
.flip.open.E .front{filter:drop-shadow(0 0 14px rgba(183,123,224,.75))}
.flip.open.L .front{filter:drop-shadow(0 0 22px rgba(240,177,60,.95))}
.flip .tagnew{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:2;font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.1em;padding:2px 7px;border-radius:8px;background:var(--leaf);color:var(--loam);white-space:nowrap}
.flip .tagnew.up{background:var(--crumb)}
.flip .tagnew.dust{background:var(--gem)}
.op-actions{display:flex;gap:10px}
.op-actions .btn{min-width:150px}

.shop-sec{padding:16px 12px 4px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.packs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px 4px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 8px;border-radius:8px;background:var(--soil-hi);box-shadow:inset 0 0 0 1px var(--clay);text-align:center;min-width:0}
.ptile .pk{width:44px;height:60px;font-size:22px}
.ptile .pn{font-family:var(--f-display);font-weight:900;font-size:15px;text-transform:uppercase;line-height:1}
.ptile .pd{font-size:10px;color:var(--dust);line-height:1.3}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:4px;padding:6px 10px;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--gem);color:var(--loam);cursor:pointer;white-space:nowrap;width:100%}
.gbtn[disabled]{background:var(--clay);color:var(--dust);cursor:default}
.gbtn.free{background:var(--leaf)}
.gbtn.free[disabled]{background:var(--clay)}
.odds{padding:4px 12px 8px;font-size:10px;color:var(--dust);line-height:1.55;font-family:var(--f-mono)}
.srow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--clay)}
.srow .si{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--loam);color:var(--crumb);font-size:17px;box-shadow:inset 0 0 0 1px var(--clay)}
.srow .gbtn{width:auto;min-width:76px}
.srow .own{font-family:var(--f-mono);font-size:10px;color:var(--crumb)}

.pass-head{margin:12px;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--banner-deep),#3a1712 55%,var(--soil-hi));box-shadow:inset 0 0 0 1px rgba(240,177,60,.3);display:flex;flex-direction:column;gap:9px}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph-eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--crumb);font-weight:600}
.ph-title{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase}
.ph-tier{flex:none;width:54px;height:54px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#ffe7ad,var(--crumb) 50%,var(--crumb-deep));color:#4a2e08;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;box-shadow:0 0 0 3px rgba(240,177,60,.25)}
.ph-tier small{font-family:var(--f-mono);font-size:8px;letter-spacing:.1em}
.xpbar{height:9px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}
.xpbar div{height:100%;background:linear-gradient(90deg,var(--crumb),#ffd98a);border-radius:5px;transition:width .3s}
.ph-xp{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--chalk);font-variant-numeric:tabular-nums}
.ph-how{font-size:11px;color:var(--dust);line-height:1.4}
.ph-btns{display:flex;gap:8px}
.ph-btns>*{flex:1}
.ph-btns .btn{font-size:16px;padding:8px}
.tracks-h{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;padding:4px 12px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--dust)}
.tracks-h span:last-child{color:var(--gem)}
.tier{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:stretch;padding:5px 12px}
.tier .tn{display:grid;place-items:center;border-radius:50%;width:34px;height:34px;align-self:center;background:var(--clay);color:var(--dust);font-family:var(--f-display);font-weight:900;font-size:16px}
.tier.reached .tn{background:var(--crumb);color:var(--loam)}
.rw{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;background:var(--soil-hi);box-shadow:inset 0 0 0 1px var(--clay);min-width:0;font-size:11px;font-weight:600;line-height:1.2}
.rw .ri{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--loam);color:var(--crumb);font-size:14px}
.rw span{min-width:0}
.rw.prem .ri{color:var(--gem)}
.rw.can{box-shadow:inset 0 0 0 2px var(--crumb);background:var(--crumb-wash);cursor:pointer;animation:ready 1.8s ease-in-out infinite}
.rw.done{opacity:.45}
.rw.lock{opacity:.62}
.rw em{display:block;font-style:normal;font-family:var(--f-mono);font-size:9px;color:var(--crumb);margin-top:2px;letter-spacing:.06em}
.rw.done em{color:var(--leaf)}
.rw.lock em{color:var(--dust)}
.rw.prem.lock em{color:var(--gem)}
.war-card{margin:12px;padding:14px;border-radius:10px;background:linear-gradient(135deg,#2a1512,var(--soil-hi));box-shadow:inset 0 0 0 1px rgba(201,55,42,.45);display:flex;flex-direction:column;gap:9px}
.war-name{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.war-hp{height:12px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(201,55,42,.35)}
.war-hp div{height:100%;background:repeating-linear-gradient(-45deg,var(--banner) 0 8px,var(--banner-deep) 8px 16px);border-radius:6px;transition:width .3s}
.war-hp.gold div{background:repeating-linear-gradient(-45deg,var(--crumb) 0 8px,var(--crumb-deep) 8px 16px)}
.war-note{margin:0;font-size:11px;color:var(--dust);line-height:1.45}
.row.doc .price{color:var(--r-l)}
.row.doc.ready{background:rgba(240,177,60,.08)}
.row.doc.ready .price{background:var(--r-l);border-color:var(--r-l);color:var(--loam);animation:none}
.flip .tagnew.shard{background:var(--clay);color:var(--chalk)}
.ccard .cl{flex-direction:column;align-items:center;gap:2px;width:100%}
.ccard .cl span{font-family:var(--f-mono);font-size:8px;font-weight:600;color:var(--rc);letter-spacing:.08em}
.ccard .cl i{display:block;width:80%;height:3px;border-radius:2px;background:var(--clay);overflow:hidden}
.ccard .cl i b{display:block;height:100%;background:var(--rc)}
.subbar .seg button{padding:4px 9px}
@media (prefers-reduced-motion: reduce){.flip,.rw.can,.packbtn,.ccard.L::after,.gem-pill.bump{animation:none}.flip-in{transition:none}}

@media (prefers-reduced-motion: reduce){.ticker-track,.badge,.sheet,.toast,.card,.row.ready .price,.medal.won .disc::after,.fervor.max .lbl,.prog-bar div,.fuse div::after{animation:none}.quota.stamped .q-done{animation:none}}
@media (max-height:700px){.bank-num{font-size:38px}.stage{flex-basis:28%;min-height:140px}.q-reward{display:none}.q-stamp{width:36px;height:36px}.q-stamp b{font-size:15px}}

/* ===== Skin: sunny garden ===== */
/* Layout unchanged; palette is a bright daytime garden: sky-blue ground, white rounded panels, chunky 3D buttons. */
:root{
  --loam:#1d2b53;   /* ink: text on bright accents, outlines */
  --soil:#ffffff;   /* panels */
  --soil-hi:#f2f6ff;/* inner wells */
  --clay:#dfe6f5;   /* rules, inactive */
  --tunnel:#f2c793; /* canvas tunnels */
  --chalk:#1d2b53;  /* text */
  --dust:#6b7a99;   /* muted text */
  --crumb:#ffbf1f; --crumb-deep:#e08600; --crumb-wash:#fff8e1;
  --banner:#ff4d6d; --banner-deep:#d4294f;
  --leaf:#2ec455; --leaf-deep:#1e9a3e;
  --sky:#2f8cff; --sky-deep:#1c6ad6;
  --jelly:#a855f7; --gem:#ff7a1a;
  --r-c:#97a3bd; --r-r:#2f8cff; --r-e:#a855f7; --r-l:#ffae00;
  --f-display:'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --f-body:'Nunito', system-ui, -apple-system, sans-serif;
  --f-mono:'Nunito', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
body{background:linear-gradient(180deg,#36a9ff 0%,#6cccff 40%,#b9e9ff 100%);color:var(--chalk);font-weight:700}
.ticker{background:var(--banner);color:#fff;border-radius:999px;box-shadow:0 3px 0 var(--banner-deep);font-weight:800;letter-spacing:.04em}
.bank-num{color:#ffd23f;text-shadow:0 3px 0 #d98200,0 6px 14px rgba(0,50,110,.25);font-weight:700}
.bank-label{color:#fff;text-shadow:0 1px 2px rgba(0,50,110,.35);font-weight:800}
.rates>span:not(.pher-chip){background:rgba(255,255,255,.92);padding:1px 9px;border-radius:999px;box-shadow:0 2px 0 rgba(20,70,140,.15)}
.rates b{color:var(--chalk);font-weight:900}
.rates .muted{color:var(--dust)}
.rates b.boost{color:var(--leaf-deep)}
.rates b.slump{color:var(--banner)}
.pher-chip{background:#fff;color:var(--banner);padding:1px 9px;border-radius:999px;box-shadow:0 2px 0 rgba(20,70,140,.15)}
.snd{background:rgba(255,255,255,.85);border:0;color:var(--dust);font-weight:800}
.gem-pill{background:#fff;border:0;box-shadow:0 2px 0 #f2b27f;color:var(--gem);font-weight:900}

.quota{background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(20,70,140,.12),0 10px 20px rgba(20,70,140,.12)}
.q-bar{background:var(--soil-hi)}
.q-bar div{background:repeating-linear-gradient(-45deg,var(--leaf) 0 6px,var(--leaf-deep) 6px 12px)}
.q-reward b{color:var(--crumb-deep)}
.q-done span{background:rgba(255,255,255,.95)}

.use{background:#fff;border:0;box-shadow:0 3px 0 rgba(20,70,140,.18);color:var(--chalk);font-weight:800}
.use .ui{background:#fff3d1;color:var(--crumb-deep);box-shadow:none}
.use b{background:var(--banner);color:#fff}
.belt-empty{background:rgba(255,255,255,.35);border:2px dashed rgba(255,255,255,.95);color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,50,110,.3)}

.stage{border-radius:22px;background:#7fd3ff;box-shadow:0 0 0 4px #fff,0 12px 26px rgba(20,70,140,.28)}
.hint{background:#fff;color:var(--chalk);font-weight:900;box-shadow:0 3px 0 rgba(20,70,140,.2)}
.buff{background:#fff;color:var(--leaf-deep);box-shadow:0 2px 0 rgba(20,70,140,.15);font-weight:900}
.buff.bad{color:var(--banner);box-shadow:0 2px 0 rgba(20,70,140,.15)}
.buff.gold{color:var(--crumb-deep);box-shadow:0 2px 0 rgba(20,70,140,.15)}
.season{background:#fff;color:var(--chalk);box-shadow:0 2px 0 rgba(20,70,140,.15);font-weight:900}
.season em{color:var(--dust)}
.fervor .lbl{background:#fff;color:var(--chalk);font-weight:900;border-radius:999px;padding:2px 9px}
.fervor .track{background:rgba(255,255,255,.75);height:9px;border-radius:5px;box-shadow:none}
.fervor .track div{background:linear-gradient(90deg,#ffd23f,#ff8a1f 60%,var(--banner))}
.fervor.max .lbl{color:var(--banner)}

.toast{background:#fff;box-shadow:0 5px 0 rgba(20,70,140,.12),0 12px 26px rgba(20,70,140,.22);border-radius:14px}
.toast .ti{background:var(--soil-hi);color:var(--chalk)}
