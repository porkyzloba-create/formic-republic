.devhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dust);margin-bottom:8px}.devhead b{color:var(--chalk)}
.devbtns{display:flex;flex-wrap:wrap;gap:6px}
.devbtns button{border:0;border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;font-weight:800;background:#fff;color:var(--chalk);box-shadow:0 2px 0 #c5cfe3;cursor:pointer}
.devbtns button[disabled]{opacity:.45;cursor:default}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.kit-i{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:12px;background:var(--soil-hi);font-size:12px;font-weight:800;color:var(--chalk)}
.kit-i span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff3d1;color:var(--crumb-deep);font-size:14px}

/* ===== Skin: Poster (Figma "Formic Republic UI Redesign") =====
   Paper ground, ink type, poster red for prestige and danger, sun yellow for "buy/claim".
   Display face Dela Gothic One for numbers and titles, Onest for everything else.
   Layout: header, Plan ticket, the hill, the section content, and a 5-item bottom nav.
   On sections other than Hill the hill shrinks to a strip (fights and picnics still happen there). */
:root{
  --loam:#1D1A2B; --soil:#FFFBF3; --soil-hi:#EBDFCB; --clay:#DCCFB8; --tunnel:#f2c793;
  --chalk:#1D1A2B; --dust:#5E5872;
  --crumb:#FFC738; --crumb-deep:#C98E00; --crumb-wash:#FFF3CF;
  --banner:#E5392D; --banner-deep:#A9221A;
  --leaf:#2FA862; --leaf-deep:#1D7A45;
  --sky:#1D1A2B; --sky-deep:#000000;
  --jelly:#8E5BF2; --gem:#FF7A1A;
  --paper:#F7F0E3; --ink:#1D1A2B; --card-line:#DCCFB8;
  --r-c:#A39C8C; --r-r:#3A7BFF; --r-e:#8E5BF2; --r-l:#F0A500;
  --f-display:'Dela Gothic One','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: light;
}
body{background:var(--paper);background-image:radial-gradient(rgba(29,26,43,.035) 1px,transparent 1px);background-size:5px 5px;color:var(--ink);font-family:var(--f-body);font-weight:600}
.app{gap:8px;padding-block:10px 10px}
/* ticker */
.ticker{background:var(--banner);color:#fff;border-radius:8px;box-shadow:none;font-family:var(--f-body);font-weight:800;font-size:10.5px;letter-spacing:.08em;padding-block:6px}
.ticker-track span{padding-inline:16px}
/* header */
.top{align-items:flex-start;gap:10px}
.bank{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.bank-label{order:0;color:var(--dust);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-shadow:none;margin:0}
.bank-num{font-family:var(--f-display);font-weight:400;color:var(--ink);text-shadow:none;font-size:clamp(34px,11vw,46px);line-height:.95;letter-spacing:-.01em}
.rates{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px;font-family:var(--f-body);font-size:12px;text-align:left}
.rates>span:not(.pher-chip),.rchip{background:var(--soil);border:1.5px solid var(--card-line);box-shadow:none;padding:3px 10px;border-radius:999px;color:var(--dust);font-weight:700}
.rates b{color:var(--ink);font-weight:800}.rates b.boost{color:var(--leaf-deep)}.rates b.slump{color:var(--banner)}
.pher-chip{background:var(--soil);border:1.5px solid var(--banner);box-shadow:none;color:var(--banner);font-weight:800;padding:3px 10px;border-radius:999px;font-size:11px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.side-row{display:flex;gap:6px;align-items:center}
.gem-pill{background:var(--ink);color:#fff;border:0;box-shadow:none;padding:4px 10px 4px 7px;font-family:var(--f-body);font-weight:800;font-size:13px}
.gem-pill svg{color:var(--gem);filter:none}
.snd{width:30px;height:30px;justify-content:center;padding:0;border-radius:10px;background:var(--soil-hi);border:0;color:var(--dust);font-size:15px}
.flightbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:14px;padding:8px 14px 6px;background:var(--banner);color:#fff;box-shadow:0 3px 0 var(--banner-deep);font:inherit;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.flightbtn svg{font-size:20px}
.flightbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--banner-deep)}
.flightbtn.on{background:var(--ink);box-shadow:0 3px 0 #000}
.flightbtn .badge{top:-6px;right:-6px;background:var(--crumb);color:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.flightbtn .badge.jelly{background:var(--jelly);color:#fff}
.flightbtn.fresh::after{content:'NEW';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:900;background:var(--ink);color:#fff;border-radius:6px;padding:0 4px;line-height:11px}
/* plan ticket */
.quota{background:var(--soil);border:2px solid var(--ink);border-radius:16px;box-shadow:none;padding:8px 12px 8px 8px}
.q-stamp{width:46px;height:46px;border:0;background:var(--banner);color:#fff;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);font-family:var(--f-body);font-weight:800;font-size:8px;letter-spacing:.14em}
.q-stamp b{font-family:var(--f-display);font-weight:400;font-size:20px}
.quota.tut .q-stamp{background:var(--ink);color:var(--crumb);border:0}
.q-text{font-weight:800;font-size:14px;color:var(--ink)}
.q-count{color:var(--dust);font-weight:700;font-size:12px}
.q-bar{height:8px;background:var(--soil-hi);border-radius:4px}
.q-bar div{background:var(--banner);border-radius:4px}
.q-reward{font-family:var(--f-body);font-size:11.5px;color:var(--dust);font-weight:600}
.q-reward b{color:var(--ink);font-weight:800}
.q-done span{font-family:var(--f-display);font-weight:400;background:var(--soil);color:var(--banner);border-color:var(--banner)}
.q-go{background:var(--banner);box-shadow:0 2px 0 var(--banner-deep);font-family:var(--f-body)}
/* belt */
.belt{min-height:32px}
.use{background:var(--soil);border:1.5px solid var(--card-line);box-shadow:none;color:var(--ink);font-weight:700}
.use .ui{background:var(--crumb-wash);color:var(--crumb-deep);box-shadow:none}
.use b{background:var(--banner);color:#fff}
.belt-empty{background:transparent;border:1.5px dashed var(--card-line);color:var(--dust);text-shadow:none;font-family:var(--f-body);font-weight:700}
/* the hill */
.stage{border-radius:20px;box-shadow:none;border:2px solid var(--ink);background:#7fd3ff;flex:1 1 30%;min-height:160px}
.app:not([data-group="hill"]) .stage{flex:0 0 108px;min-height:108px}
.app:not([data-group="hill"]) .stage .fervor{display:none}
.app:not([data-group="hill"]) .belt{display:none}
.hint{background:var(--ink);color:#fff;box-shadow:none;font-family:var(--f-body);font-weight:800}
.season{background:var(--soil);color:var(--ink);box-shadow:none;font-family:var(--f-body);font-weight:800;border-radius:999px}
.season em{color:var(--dust)}
.buff{background:var(--soil);box-shadow:none;border:1.5px solid currentColor;font-family:var(--f-body);font-weight:800;color:var(--leaf-deep)}
.buff.bad{color:var(--banner)}.buff.gold{color:var(--crumb-deep)}
.fervor .lbl{background:var(--ink);color:var(--crumb);font-family:var(--f-body);font-weight:800;border-radius:999px}
.fervor .track{background:rgba(29,26,43,.55)}
.fervor .track div{background:linear-gradient(90deg,var(--crumb),var(--banner))}
.toast{background:var(--soil);border:2px solid var(--ink);box-shadow:0 6px 0 rgba(29,26,43,.18);border-radius:14px}
.toast b{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:0}
.toast span{color:var(--dust);font-weight:600}
.toast .ti{background:var(--soil-hi);color:var(--ink)}
.toast.gold b,.toast.medal b{color:var(--crumb-deep)}.toast.good b{color:var(--leaf-deep)}.toast.bad b{color:var(--banner)}.toast.jelly b{color:var(--jelly)}
.toast.gold .ti,.toast.medal .ti{background:var(--crumb);color:var(--ink)}.toast.good .ti{background:var(--leaf);color:#fff}.toast.bad .ti{background:var(--banner);color:#fff}.toast.jelly .ti{background:var(--jelly);color:#fff}
/* section content */
.panel{background:transparent;border-radius:0;box-shadow:none;gap:8px}
.groupbar{flex:none;display:flex;gap:4px;padding:4px;background:var(--soil-hi);border-radius:12px}
.gtab{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:8px 4px;background:none;color:var(--dust);font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.gtab.on{background:var(--soil);color:var(--ink);box-shadow:0 1px 0 var(--card-line)}
.gtab .badge{position:static;box-shadow:none;animation:none}
.gtab.nudge{animation:nudge 1.1s ease-in-out infinite}
.subbar{border:0;padding:2px 2px 0;font-family:var(--f-body);font-weight:700;color:var(--dust)}
.subbar b{color:var(--ink)}
.seg{background:var(--soil-hi);border:0;border-radius:10px;padding:2px}
.seg button{font-family:var(--f-body);font-weight:800;color:var(--dust);border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.list>*{flex-shrink:0}
.row{border:1.5px solid var(--card-line);border-radius:16px;background:var(--soil);padding:11px 12px 13px;overflow:hidden}
.row.ready{background:var(--soil);border-color:var(--ink)}
.row.ready:active{background:var(--crumb-wash)}
.row:not(.ready) .row-name{color:var(--ink)}
.row-name{font-family:var(--f-body);font-weight:800;font-size:15px}
.row-target{color:var(--banner);font-weight:800;font-family:var(--f-body)}
.row-sub{color:var(--dust);font-style:normal;font-weight:600}
.row-meta{font-family:var(--f-body);font-weight:600;color:var(--dust)}
.row.caste{grid-template-columns:48px 1fr auto;gap:12px}
.ctile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--cc,#ccc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ctile b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{background:var(--leaf);color:#fff;border-radius:999px;font-family:var(--f-body);font-weight:800}
.price{background:var(--soil-hi);color:var(--dust);border:0;border-radius:11px;padding:8px 12px;font-family:var(--f-body);font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--card-line)}
.row.ready .price{background:var(--crumb);color:var(--ink);box-shadow:0 3px 0 var(--crumb-deep);animation:none}
.eta{font-family:var(--f-body);font-weight:700}.row.ready .eta{color:var(--leaf-deep)}
.fill{background:var(--crumb);height:3px}
.locked{border:1.5px dashed var(--card-line);border-radius:14px;padding:10px 12px;color:var(--dust);font-weight:600}
.locked b{color:var(--ink)}
.shop-sec{padding:8px 4px 0;font-family:var(--f-body);font-weight:800;color:var(--dust)}
/* bottom nav */
.nav{flex:none;display:flex;justify-content:space-between;gap:2px;padding:6px;background:var(--soil);border:1.5px solid var(--card-line);border-radius:20px;box-shadow:0 6px 18px rgba(29,26,43,.12);margin-bottom:env(safe-area-inset-bottom,0px)}
.navb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;padding:8px 2px 7px;background:none;color:var(--dust);font:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-width:0}
.navb svg{font-size:21px}
.navb.on{background:var(--ink);color:#fff}.navb.on svg{color:var(--crumb)}
.navb .badge{top:2px;right:calc(50% - 22px);box-shadow:0 0 0 2px var(--soil)}
.navb.on .badge{box-shadow:0 0 0 2px var(--ink)}
.navb.nudge{animation:nudge 1.1s ease-in-out infinite}
.navb.fresh::after{content:'NEW';position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:7px;font-weight:900;letter-spacing:.06em;background:var(--banner);color:#fff;border-radius:6px;padding:0 4px;line-height:11px}
.badge{background:var(--crumb);color:var(--ink);font-family:var(--f-body);font-weight:900}
.badge.red{background:var(--banner);color:#fff}.badge.go{background:var(--leaf);color:#fff}.badge.jelly{background:var(--jelly);color:#fff}
/* buttons */
.btn{font-family:var(--f-body);font-weight:900;letter-spacing:.06em;border-radius:13px;background:var(--banner);color:#fff;box-shadow:0 4px 0 var(--banner-deep);font-size:16px}
.btn.gold,.btn.confirm{background:var(--crumb);color:var(--ink);box-shadow:0 4px 0 var(--crumb-deep)}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep)}
.btn.ghost{background:var(--soil-hi);border:0;color:var(--dust);box-shadow:0 3px 0 var(--card-line)}
.btn[disabled],.btn.gold[disabled],.btn.go[disabled],.btn.confirm[disabled]{background:var(--soil-hi);color:#a39c8c;box-shadow:0 3px 0 var(--card-line)}
.gbtn{font-family:var(--f-body);font-weight:900;border-radius:11px;background:var(--crumb);color:var(--ink);box-shadow:0 3px 0 var(--crumb-deep)}
.gbtn.ad,.gbtn.free{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-deep)}
.gbtn.cash{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-deep)}
.gbtn[disabled],.gbtn.free[disabled],.gbtn.cash[disabled],.gbtn.ad[disabled]{background:var(--soil-hi);color:#a39c8c;box-shadow:0 3px 0 var(--card-line)}
/* modals, sheet, pack opening */
.modal{background:rgba(29,26,43,.6)}
.card{background:var(--soil);border:2px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 rgba(29,26,43,.25)}
.card-band{background:var(--banner);font-family:var(--f-body);font-weight:900;letter-spacing:.12em}
.card .amount{font-family:var(--f-display);font-weight:400;color:var(--ink);text-shadow:none;font-size:40px}
.card p{color:var(--dust);font-weight:600}
.streak div{background:var(--soil-hi);color:#a39c8c;font-family:var(--f-display);font-weight:400}
.streak div.on{background:var(--leaf);color:#fff}.streak div.today{background:var(--banner);color:#fff;box-shadow:0 0 0 3px var(--soil),0 0 0 5px var(--ink)}
.sheet{background:var(--soil);border:2px solid var(--ink);box-shadow:0 10px 0 rgba(29,26,43,.25);border-radius:18px}
.sh-band{font-family:var(--f-body);font-weight:900}
.sh-title{font-family:var(--f-display);font-weight:400;font-size:22px}
.sh-icon{background:var(--crumb-wash);color:var(--banner)}
.sh-actions .btn.ghost{background:var(--soil-hi);color:var(--ink)}
.opening{background:radial-gradient(circle at 50% 38%,#3a2f55,#1D1A2B 72%)}
.op-title{font-family:var(--f-display);font-weight:400;color:#fff;text-shadow:none}
.op-sub{color:rgba(255,255,255,.75);font-family:var(--f-body);font-weight:700}
.flip .back{background:repeating-linear-gradient(45deg,var(--banner) 0 8px,var(--banner-deep) 8px 16px);box-shadow:inset 0 0 0 3px var(--crumb),0 6px 18px rgba(0,0,0,.5);color:var(--crumb)}
/* cards */
.ccard{background:var(--soil);border-radius:14px;box-shadow:inset 0 0 0 3px var(--rc)}
.ccard .rl{font-family:var(--f-body);font-weight:900}
.ccard .cn{font-family:var(--f-body);font-weight:900;font-size:12px;text-transform:none;color:var(--ink)}
.ccard .cf{color:var(--dust);font-weight:600}
.ccard .ci{background:#fff}
.ccard.unknown{background:var(--soil-hi);box-shadow:inset 0 0 0 2px var(--card-line)}
.ccard.unknown .cn,.ccard.unknown .cf,.ccard.unknown .ci{color:#b5ab98}
.packbtn{background:var(--crumb);box-shadow:0 4px 0 var(--crumb-deep);border-radius:14px;color:var(--ink);animation:none}
.packbtn small{color:var(--ink);opacity:.7}
.packbar{padding:0}
.cgrid{padding:0}
.secret{border-radius:16px}
/* goals */
.dir-head{background:var(--ink);box-shadow:none;border-radius:18px}
.dir-head .ph-eyebrow{color:var(--crumb)}
.dir-title{font-family:var(--f-display);font-weight:400;font-size:18px}
.dir,.dir-chest{border:1.5px solid var(--card-line);border-radius:16px;background:var(--soil)}
.dir.ready,.dir-chest.ready{border-color:var(--ink);background:var(--crumb-wash)}
.dir-ic{background:var(--soil-hi);color:var(--ink)}
.dir-bar div{background:var(--banner)}
.dir-week{background:var(--soil-hi);margin:0}
.dir-head{margin:0}
.medals{padding:0}
.medal{background:var(--soil);border:1.5px solid var(--card-line);border-radius:14px}
.pass-head{background:var(--banner);box-shadow:0 5px 0 var(--banner-deep);margin:0}
.ph-title{font-family:var(--f-display);font-weight:400;text-shadow:none}
.ph-tier{font-family:var(--f-display);font-weight:400}
.tier{padding:4px 0}
.rw{background:var(--soil);border:1.5px solid var(--card-line)}
.rw.can{background:var(--crumb-wash);border-color:var(--ink);box-shadow:none}
/* shop */
.offer{background:var(--banner);box-shadow:none;border-radius:18px;margin:0;color:#fff}
.offer .of-tag{color:var(--crumb)}.offer .row-name{color:#fff}.offer .row-sub{color:rgba(255,255,255,.85)}
.offer .of-ic{background:var(--crumb);color:var(--ink)}
.offer .gbtn.cash{background:var(--crumb);color:var(--ink);box-shadow:0 3px 0 var(--crumb-deep)}
.amber5{padding:0}
.atile{background:var(--soil);border:1.5px solid var(--card-line)}
.atile.hot{border:2.5px solid var(--ink);box-shadow:none}
.atag{background:var(--banner)}
.atile .an{font-family:var(--f-display);font-weight:400;color:var(--ink)}
.atile .dbl{color:var(--banner)}
.srow{border:1.5px solid var(--card-line);border-radius:14px;background:var(--soil)}
.srow .si{background:var(--soil-hi);box-shadow:none}
.packs3{padding:0}
.ptile{background:var(--soil);border:1.5px solid var(--card-line)}
.ptile .pn{font-family:var(--f-display);font-weight:400;font-size:13px}
.odds{padding:2px 4px}
/* flight + endgame */
.flight{padding:0;gap:12px}
.flight h2{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--banner)}
.flight h3{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--jelly)}
.edicts{margin-inline:0;border:0;gap:8px;display:flex;flex-direction:column}
.war-card{margin:0;border-radius:18px}
.war-name{font-family:var(--f-display);font-weight:400;font-size:20px}
.abyss-head{margin:0}
.abyss-title,.guard-name{font-family:var(--f-display);font-weight:400}
.raid{border:1.5px solid var(--card-line);border-radius:16px;background:var(--soil)}
.raid.done{background:var(--crumb-wash);border-color:var(--ink)}
.raid-icon{background:var(--crumb-wash);color:var(--crumb-deep)}
.devbox{margin:4px 0}
@media (max-height:700px){.bank-num{font-size:32px}.app:not([data-group="hill"]) .stage{flex-basis:84px;min-height:84px}}
/* ===== CARDS V2 (Figma: Card v2 set) ===== */
.ccard.C{--rc:#A39A88;--rc2:#8C8370;--rt:#EFE8DA;--rd:#6E6656;--cbg:#FFFBF3;--cink:#1D1A2B;--csoft:#5E5872;--bt:#FFFBF3}
.ccard.R{--rc:#2E7CF6;--rc2:#2E7CF6;--rt:#DCEBFF;--rd:#1F5BC0;--cbg:#FFFBF3;--cink:#1D1A2B;--csoft:#5E5872;--bt:#FFFBF3}
.ccard.E{--rc:#8E5BF2;--rc2:#8E5BF2;--rt:#ECE2FF;--rd:#6237C9;--cbg:#FFFBF3;--cink:#1D1A2B;--csoft:#5E5872;--bt:#FFFBF3}
.ccard.L{--rc:#FFC738;--rc2:#F29A00;--rt:#FFF0C2;--rd:#A86F00;--cbg:#FFF8E6;--cink:#1D1A2B;--csoft:#6B5A35;--bt:#1D1A2B}
.ccard.M{--rc:#FF4FA3;--rc2:#8E5BF2;--rt:#3A1F55;--rd:#FFB8E0;--cbg:#241433;--cink:#FFFBF3;--csoft:#D9C8F0;--bt:#FFFBF3}
.ccard.P{--rc:#22D3EE;--rc2:#0E7490;--rt:#0F3445;--rd:#7DEBFF;--cbg:#0A1B26;--cink:#FFFBF3;--csoft:#A9DDE8;--bt:#05202A}
.ccard.v2{position:relative;aspect-ratio:5/7;padding:0;gap:0;display:flex;flex-direction:column;align-items:stretch;text-align:center;
  background:var(--cbg);border:2.5px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink);overflow:hidden;min-width:0;animation:none}
.ccard.v2::before,.ccard.v2::after{display:none}
.ccard.v2 .cb{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 7px;background:linear-gradient(90deg,var(--rc),var(--rc2));min-height:20px}
.ccard.v2 .rl{font-family:var(--f-body);font-weight:900;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--bt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard.v2 .lv{flex:none;font-weight:900;font-size:7.5px;letter-spacing:.05em;background:var(--ink);color:#FFFBF3;border-radius:5px;padding:2px 5px}
.ccard.v2 .ca{position:relative;margin:5px 5px 0;flex:0 0 auto;aspect-ratio:134/74;border-radius:9px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 54%,transparent 0 22%,color-mix(in srgb,var(--rc) 30%,transparent) 22% 30%,transparent 30% 40%,color-mix(in srgb,var(--rc) 22%,transparent) 40% 48%,transparent 48% 60%,color-mix(in srgb,var(--rc) 16%,transparent) 60% 68%,transparent 68%),var(--rt);
  box-shadow:inset 0 0 0 2px var(--ink)}
.ccard.M .ca,.ccard.P .ca{box-shadow:inset 0 0 0 2px var(--rd)}
.ccard.v2 .cd{width:auto;height:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#FFFBF3;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--rd);font-size:clamp(15px,5.4vw,24px)}
.ccard.M .cd,.ccard.P .cd{background:var(--cbg);border-color:var(--rd);box-shadow:0 3px 0 rgba(0,0,0,.6)}
.ccard.v2 .cn{margin:5px 5px 0;font-family:var(--f-display);font-weight:400;font-size:clamp(9px,2.75vw,12px);line-height:1.04;color:var(--cink);text-transform:none;text-wrap:balance;min-height:2.1em;display:flex;align-items:center;justify-content:center}
.ccard.v2 .cf{margin:3px 5px 0;display:flex;justify-content:center}
.ccard.v2 .cf span{background:var(--rt);color:var(--rd);font-weight:800;font-size:clamp(7px,2.1vw,9px);line-height:1.18;padding:2px 6px;border-radius:9px;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard.M .cf span,.ccard.P .cf span{background:color-mix(in srgb,var(--rc) 20%,transparent)}
.ccard.v2 .cl{margin:auto 7px 6px;padding-top:3px;display:flex;flex-direction:row;align-items:center;gap:5px;width:auto}
.ccard.v2 .cl i{flex:1;display:block;height:5px;border-radius:3px;background:#DCCFB8;overflow:hidden;width:auto}
.ccard.M .cl i,.ccard.P .cl i{background:rgba(255,255,255,.15)}
.ccard.v2 .cl i b{display:block;height:100%;background:linear-gradient(90deg,var(--rc),var(--rc2))}
.ccard.v2 .cl span{font-family:var(--f-body);font-weight:900;font-size:8px;color:var(--csoft);letter-spacing:0}
.ccard.v2 .cl .mx{flex:1;text-align:center;color:var(--rd);letter-spacing:.1em}
.ccard.L.v2 .ca::after,.ccard.M.v2 .ca::after,.ccard.P.v2 .ca::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:260% 100%;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.ccard.L.v2{box-shadow:0 4px 0 var(--ink),0 0 0 3px rgba(255,199,56,.35)}
.ccard.M.v2{box-shadow:0 4px 0 var(--ink),0 0 18px rgba(255,79,163,.45)}
.ccard.P.v2{box-shadow:0 4px 0 var(--ink),0 0 18px rgba(34,211,238,.45)}
.ccard.v2.unknown{background:#EBDFCB;border:2px dashed #B9AC94;box-shadow:none}
.ccard.v2.unknown .cb{background:#DCCFB8}
.ccard.v2.unknown .rl{color:#9C8F78}
.ccard.v2.unknown .ca{background:#E2D5BE;box-shadow:none}
.ccard.v2.unknown .cq{font-family:var(--f-display);font-size:clamp(22px,8vw,40px);color:#B9AC94}
.ccard.v2.unknown .cn{color:#9C8F78}
.ccard.v2.unknown .cf{font-size:clamp(7.5px,2.2vw,9px);font-weight:700;color:#9C8F78;line-height:1.25;padding:0 2px}
.cgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px;padding:4px 0 10px}
@media (min-width:520px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
/* collection meter */
.cmeter{background:var(--soil);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.cm-top{display:flex;align-items:baseline;justify-content:space-between}
.cm-t{font-family:var(--f-display);font-size:16px;text-transform:uppercase}
.cm-n{font-weight:700;font-size:12px;color:var(--dust)} .cm-n b{font-weight:900;font-size:17px;color:var(--ink)}
.cm-bar{display:flex;height:10px;border-radius:6px;background:#EBDFCB;border:1.5px solid var(--ink);overflow:hidden}
.cm-bar i{display:block;height:100%}
.cm-bar i.C,.cm-leg .C i{background:#A39A88} .cm-bar i.R,.cm-leg .R i{background:#2E7CF6} .cm-bar i.E,.cm-leg .E i{background:#8E5BF2}
.cm-bar i.L,.cm-leg .L i{background:#F2A900} .cm-bar i.M,.cm-leg .M i{background:#FF4FA3} .cm-bar i.P,.cm-leg .P i{background:#22D3EE}
.cm-leg{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:10.5px;font-weight:700;color:var(--dust)}
.cm-leg span{display:inline-flex;align-items:center;gap:4px} .cm-leg i{width:7px;height:7px;border-radius:50%}
.cm-leg .cm-pity{margin-left:auto;color:var(--crumb-deep);font-weight:800}
/* pack shelf */
.pshelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ptile2{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--soil);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.ptile2:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pk2{position:relative;flex:none;width:38px;height:50px;border-radius:7px;transform:rotate(-6deg);border:2px solid var(--ink);
  background:linear-gradient(var(--ink) 0 6px,transparent 6px calc(100% - 6px),var(--ink) calc(100% - 6px)),linear-gradient(170deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 70%,#000));display:grid;place-items:center}
.pk2-s{width:20px;height:20px;border-radius:50%;background:#FFFBF3;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11px;color:var(--ink)}
.pk2 em{position:absolute;top:-8px;right:-12px;transform:rotate(6deg);font-style:normal;font-weight:900;font-size:10px;background:var(--banner);color:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:1px 5px}
.pt2{display:flex;flex-direction:column;min-width:0;gap:1px}
.pt2 b{font-weight:800;font-size:12.5px;line-height:1.15}
.pt2 small{font-size:10px;font-weight:700;color:var(--dust)}
.pt2-go{margin-top:4px;align-self:flex-start;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--crumb);border:1.5px solid var(--ink);border-radius:8px;padding:2px 8px}
.btn.gold.openall2{width:100%;font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.02em;text-transform:uppercase;padding:12px;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.cfilter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.cfilter button{flex:none;border:0;font:inherit;font-weight:800;font-size:11.5px;padding:6px 11px;border-radius:20px;background:#EBDFCB;color:var(--dust);cursor:pointer}
.cfilter button[aria-pressed="true"]{background:var(--ink);color:#FFFBF3}
/* pack opening */
.opening{background:radial-gradient(circle at 50% 42%,#3A3458 0,#1D1A2B 62%)}
.opening h2,#op-title{font-family:var(--f-display);font-weight:400;color:#FFFBF3}
.flip .back{background:none;box-shadow:none;border-radius:13px}
.cbk{position:absolute;inset:0;border-radius:13px;background:#1D1A2B;border:2.5px solid #FFFBF3;box-shadow:0 4px 0 rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:center}
.cbk::before{content:'';position:absolute;inset:6px;border:2px solid #FFC738;border-radius:9px}
.cbk-r{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,199,56,.32) 0 1.5px,transparent 1.5px 13px)}
.cbk-d{position:relative;width:42%;aspect-ratio:1;border-radius:50%;background:#FFC738;display:grid;place-items:center;color:#1D1A2B;font-size:clamp(18px,6vw,30px)}
.cbk b{position:absolute;bottom:11%;font-family:var(--f-display);font-weight:400;font-size:clamp(8px,2.6vw,11px);letter-spacing:.2em;color:#FFC738}
.flip .tagnew{font-family:var(--f-body);font-weight:900;font-size:9px;border:1.5px solid var(--ink);border-radius:8px;padding:2px 7px;top:-10px}
.flip.open.R .front{filter:drop-shadow(0 0 10px rgba(46,124,246,.6))}
.flip.open.E .front{filter:drop-shadow(0 0 14px rgba(142,91,242,.7))}
.flip.open.L .front{filter:drop-shadow(0 0 22px rgba(255,199,56,.9))}
.op-actions .btn{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;text-transform:uppercase;border:2px solid #FFFBF3;padding:11px 26px}
#op-all{background:transparent;color:#FFFBF3;box-shadow:0 4px 0 rgba(255,251,243,.25)}
#op-done{background:var(--crumb);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 #000}
.ph-perks{display:flex;gap:8px;align-items:flex-start;background:#FFFBF3;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;line-height:1.35}
.ph-perks svg{flex:none;width:16px;height:16px;color:var(--crumb-deep);margin-top:1px}
.ph-perks b{font-weight:900}
.ph-perks.on{background:var(--crumb)}
/* toasts: top sheet */
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),440px);bottom:auto;right:auto;z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{grid-template-columns:30px 1fr;gap:10px;background:#FFFBF3;border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:8px 12px 9px 8px;animation:tdrop .32s cubic-bezier(.2,1.3,.5,1)}
@keyframes tdrop{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
.toast .ti{width:30px;height:30px;border:2px solid var(--ink);font-size:15px;background:#EBDFCB;color:var(--ink)}
.toast b{font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:0;color:var(--ink)}
.toast span{font-size:11.5px;font-weight:600;color:var(--dust)}
.toast.good b,.toast.bad b,.toast.gold b,.toast.jelly b,.toast.medal b{color:var(--ink)}
.toast.good .ti{background:var(--leaf);color:#fff} .toast.bad .ti{background:var(--banner);color:#fff}
.toast.gold .ti,.toast.medal .ti{background:var(--crumb);color:var(--ink)} .toast.jelly .ti{background:var(--jelly);color:#fff}
.toast::after{height:3px}
/* flight */
.fl-hero{background:var(--banner);color:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px}
.fl-top{display:flex;gap:11px;align-items:center}
.fl-ic{flex:none;width:44px;height:44px;border-radius:50%;background:#FFFBF3;border:2px solid var(--ink);color:var(--banner);display:grid;place-items:center;font-size:22px}
.fl-eye{font-weight:900;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.fl-hero h2{color:#fff !important;font-size:24px !important;margin:2px 0 0}
.fl-gain{background:rgba(0,0,0,.18);border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fl-gain span{font-weight:800;font-size:11.5px}
.fl-gain b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--crumb)}
.fl-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl-stats div{background:#FFFBF3;color:var(--ink);border-radius:11px;padding:7px 10px;display:flex;flex-direction:column;gap:1px}
.fl-stats .w{grid-column:span 2;flex-direction:row;justify-content:space-between;align-items:center}
.fl-stats span{font-size:10px;font-weight:800;color:var(--dust);text-transform:uppercase;letter-spacing:.06em}
.fl-stats b{font-weight:900;font-size:15px}
.fl-hero .btn{background:var(--crumb);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.fl-hero .btn:disabled{background:#EBDFCB;color:var(--dust);box-shadow:0 4px 0 rgba(29,26,43,.35);border-color:rgba(29,26,43,.35)}
.fl-trade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl-col{background:var(--soil);border:2px solid var(--ink);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--dust);line-height:1.3}
.fl-col b{font-weight:900;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.fl-col.keep b{color:var(--leaf-deep)} .fl-col.lose b{color:var(--banner)}
.fl-col span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:currentColor;opacity:.5}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sec-h h3{margin:0}
.sec-h h3.ink{color:var(--ink)}
.jpill{display:inline-flex;align-items:center;gap:5px;background:var(--jelly);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:3px 10px;font-weight:900;font-size:13px}
.jpill b{color:#fff}
.ledger.record{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ledger.record dt{display:none}
.ledger.record dd{background:var(--soil);border:2px solid var(--clay);border-radius:12px;padding:8px 10px;text-align:left;font-weight:900;font-size:15px;display:flex;flex-direction:column}
.ledger.record dd::before{content:attr(data-l);font-size:9.5px;font-weight:800;color:var(--dust);text-transform:uppercase;letter-spacing:.05em}
/* ===== bigger hill on the Hill tab =====
   The hill aims for ~42% of the screen; both it and the list can shrink, so the castes list
   keeps about two rows on a typical phone. The Plan ticket hides its reward line there (unless training
   needs its "Go to" button), which buys the hill extra room. Other tabs keep the strip. */
.app[data-group="hill"] .stage{flex:0 1 42vh;min-height:170px}
.app[data-group="hill"] .panel{flex:1 1 235px;min-height:150px}
.app[data-group="hill"] .stage{transition:flex-basis .28s ease,min-height .28s ease}
.app[data-group="hill"].compact .stage{flex-basis:118px;min-height:118px}   /* scrolled down the list: the hill tucks into a strip */
@media (prefers-reduced-motion: reduce){.app[data-group="hill"] .stage{transition:none}}
.app[data-group="hill"] .quota:not(.tut) .q-reward{display:none}
.app[data-group="hill"] .quota:not(.tut){padding-block:6px}
.app[data-group="hill"] .quota:not(.tut) .q-stamp{width:38px;height:38px}
.app[data-group="hill"] .quota:not(.tut) .q-stamp b{font-size:17px}
/* ===== online: weekly league + alliances ===== */
.lb-head{background:var(--ink);color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lb-head .ph-eyebrow{color:var(--crumb)}
.lb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lb-title{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.lb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lb-stats div{background:rgba(255,255,255,.1);border-radius:11px;padding:7px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.lb-stats span{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.lb-stats b{font-family:var(--f-display);font-weight:400;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-note{font-size:11px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.4}
.lb-list{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--card-line);border-radius:14px;background:var(--soil)}
.lb-row.me{border:2px solid var(--ink);background:var(--crumb-wash)}
.lb-rank{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soil-hi);font-family:var(--f-display);font-size:13px;color:var(--ink)}
.lb-row.p1 .lb-rank{background:#FFC738}.lb-row.p2 .lb-rank{background:#DCCFB8}.lb-row.p3 .lb-rank{background:#E8A87C}
.lb-name{font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sub{font-size:11px;font-weight:700;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-family:var(--f-display);font-size:15px;color:var(--ink);text-align:right;white-space:nowrap}
.lb-gap{text-align:center;font-weight:900;color:var(--dust);letter-spacing:.3em;font-size:12px;padding:2px 0}
.lb-empty{border:1.5px dashed var(--card-line);border-radius:14px;padding:16px 12px;text-align:center;color:var(--dust);font-weight:700;font-size:12.5px;line-height:1.45}
.oform{background:var(--soil);border:2px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px}
.oform h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px}
.oform p{margin:0;font-size:12px;font-weight:600;color:var(--dust);line-height:1.45}
.orow{display:flex;gap:8px}
.oinput{flex:1;min-width:0;border:2px solid var(--card-line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
.oinput:focus{outline:none;border-color:var(--ink)}
.oinput.code{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-display);font-weight:400}
.orow .btn{font-size:14px;padding:9px 14px;white-space:nowrap}
.rewards{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12px;font-weight:700;color:var(--dust);background:var(--soil-hi);border-radius:14px;padding:10px 12px}
.rewards b{color:var(--ink);font-weight:900}
.rewards span:nth-child(even){text-align:right}
.al-code{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:4px 6px 4px 10px;font-family:var(--f-display);font-size:16px;letter-spacing:.18em}
.al-code button{border:0;border-radius:8px;background:var(--crumb);color:var(--ink);font:inherit;font-family:var(--f-body);font-weight:900;font-size:11px;letter-spacing:.04em;padding:4px 9px;cursor:pointer}
.chest-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
.chest-bar div{height:100%;background:linear-gradient(90deg,var(--crumb),#ffe08a);border-radius:6px;transition:width .3s}
.ctier{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--card-line);border-radius:14px;background:var(--soil)}
.ctier.ready{border-color:var(--ink);background:var(--crumb-wash)}
.ctier.got{opacity:.55}
.ctier .dir-ic{width:40px;height:40px}
.ctier.ready .dir-ic{background:#ffe9a8;color:var(--crumb-deep)}
.mem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--card-line);font-size:13px;font-weight:700}
.mem:last-child{border-bottom:0}
.mem.me{background:var(--crumb-wash)}
.mem small{color:var(--dust);font-weight:700;margin-left:6px}
.mem b{font-family:var(--f-display);font-weight:400;font-size:14px}
.mems{border:1.5px solid var(--card-line);border-radius:14px;background:var(--soil);overflow:hidden}
.osync{font-size:11px;font-weight:700;color:var(--dust);text-align:center;padding:2px 0 6px}
.osync button{border:0;background:none;color:var(--ink);font:inherit;font-weight:900;text-decoration:underline;cursor:pointer;padding:2px 4px}
/* ===== fun & growth: advisor, Lottery, confetti, share ===== */
/* Comrade Ant: a speech bubble that pops up on the hill */
.advisor{position:absolute;left:8px;right:8px;bottom:26px;z-index:3;display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center;text-align:left;
  background:var(--soil);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 7px 7px;font:inherit;color:var(--ink);cursor:pointer}
.advisor .adv-face{width:46px;height:46px;border-radius:50%;background:var(--crumb);border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.advisor .adv-face svg{width:42px;height:42px;margin-top:4px}
.advisor .adv-text{font-size:12.5px;font-weight:700;line-height:1.35}
.advisor.has-go .adv-text::after{content:' Tap to go →';font-weight:900;color:var(--banner)}
.advisor::before{content:'COMRADE ANT';position:absolute;top:-9px;left:58px;font-size:8.5px;font-weight:900;letter-spacing:.12em;background:var(--banner);color:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:0 6px;line-height:14px}
.advisor.pop{animation:advpop .38s cubic-bezier(.2,1.4,.5,1)}
@keyframes advpop{from{transform:translateY(16px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.app.compact .advisor{display:none}
/* the FREE SPIN pill on the hill */
.spin-pill{position:absolute;left:8px;bottom:30px;z-index:2;border:2px solid var(--ink);border-radius:999px;background:var(--crumb);color:var(--ink);font:inherit;font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:4px 11px;box-shadow:0 3px 0 var(--ink);cursor:pointer;animation:spinwob 2.4s ease-in-out infinite}
.spin-pill::before{content:'';display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:50%;background:conic-gradient(var(--banner) 0 25%,#fff 0 50%,var(--banner) 0 75%,#fff 0);border:1.5px solid var(--ink)}
@keyframes spinwob{0%,80%,100%{transform:none}85%{transform:rotate(-6deg) scale(1.06)}92%{transform:rotate(5deg) scale(1.06)}}
.app:not([data-group="hill"]) .spin-pill,.app.compact .spin-pill,.stage.fighting .spin-pill{display:none}
/* the Lottery wheel */
.spinov{z-index:30}
.spin-wrap{position:relative;width:min(78vw,280px);aspect-ratio:1;margin:4px auto 0}
#spin-wheel{width:100%;height:100%;display:block;transform-origin:50% 50%;filter:drop-shadow(0 5px 0 rgba(29,26,43,.35))}
#spin-wheel .sw-top{font-family:var(--f-display);font-size:11px}
#spin-wheel .sw-sub{font-family:var(--f-body);font-size:7.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.spin-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink)}
.spin-pointer::after{content:'';position:absolute;left:-9px;top:-24px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:17px solid var(--crumb)}
.spin-hub{position:absolute;inset:0;margin:auto;width:20%;height:20%;border-radius:50%;background:var(--crumb);border:4px solid var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
#spin-msg{text-align:center;font-weight:800;color:var(--ink);min-height:2.9em}
.srow.lottery{border-color:var(--ink);background:var(--crumb-wash)}
/* confetti layer and the share button */
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.share-btn{width:100%;background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.mile-ant{width:84px;height:84px;margin:0 auto -4px;border-radius:50%;background:var(--crumb);border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.mile-ant svg{width:76px;height:76px;margin-top:8px}
@media (prefers-reduced-motion: reduce){.spin-pill,.advisor.pop{animation:none}}
/* Privacy: the in-game policy reader, the statistics switch, league-entry deletion */
.policyov{z-index:45}
.policyov .card{max-width:560px;width:100%}
.policy-text{max-height:min(62vh,560px);overflow-y:auto;text-align:left;font-size:13.5px;line-height:1.5;color:var(--ink,#1D1A2B);padding:2px 4px 8px;overscroll-behavior:contain}
.policy-text h1{font-size:18px;margin:4px 0 2px;line-height:1.2}
.policy-text h1+p{margin-top:0;opacity:.7;font-size:12px}
.policy-text h2{font-size:14.5px;margin:16px 0 4px;color:var(--banner,#E5392D)}
.policy-text p{margin:6px 0}
.policy-text ul{margin:6px 0;padding-left:18px}
.policy-text li{margin:3px 0}
.policy-text a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
.srow.priv-row{grid-template-columns:1fr auto;align-items:center;margin:0 12px}
.priv-id code{font-size:11px;overflow-wrap:anywhere;user-select:all}
.tgl{flex:none;width:52px;height:30px;border-radius:15px;border:2px solid var(--ink,#1D1A2B);background:#d9d3c7;position:relative;cursor:pointer;padding:0}
.tgl i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink,#1D1A2B);transition:left .15s}
.tgl[aria-checked="true"]{background:var(--gem,#FFC738)}
.tgl[aria-checked="true"] i{left:25px}
.tgl:disabled{opacity:.45;cursor:default}
.lb-del{display:block;margin:18px auto 6px;font-size:12px}
.lb-del.armed{color:var(--banner,#E5392D);font-weight:800}
</style>

<script>
const PRIVACY_POLICY = "<h1>Formic Republic Privacy Policy<\/h1>\n<p>Effective 9 October 2026.<\/p>\n<p>This policy explains what information the game Formic Republic uses, why, who else handles it, and the choices you have. It covers the Google Play (Android) version, the Steam version and the browser preview.<\/p>\n<h2>The short version<\/h2>\n<ul><li>Your colony's progress is saved <b>on your device<\/b>. Taps, critical taps, the Queen's Lottery, milestones, Comrade Ant's tips and the Auto-Tapper all run on your device.<\/li><li>The <b>weekly league<\/b> and <b>alliances<\/b> are optional. If you join, the colony name you pick and your weekly score are shown publicly to other players. You can delete your league entry in the game at any time.<\/li><li>The store versions send <b>anonymous play statistics<\/b> (for example \"finished the tutorial\" or \"opened a pack\") tagged with a random install ID. No name, email, advertising ID or location. You can switch this off in the game.<\/li><li>On Android, <b>ads are only shown when you choose to watch one<\/b> for a reward. They are served by Google AdMob, which collects device information as described below.<\/li><li>We never sell your information.<\/li><\/ul>\n<h2>Who we are<\/h2>\n<p>Formic Republic is made by the Formic Republic team (\"we\", \"us\"). For any privacy question or request, write to <b>[CONTACT EMAIL]<\/b>.<\/p>\n<h2>Information that stays on your device<\/h2>\n<p>The game keeps your save (crumbs, castes, research, cards, amber, pass progress, medals, lottery spins, Auto-Tapper time, settings such as sound and the statistics switch) in your device's app storage. On Steam the save is also written to a file that Steam Cloud may sync between your computers (see \"Steam\"). We cannot see this save. \"Dissolve the Republic\" in the Flight tab deletes it.<\/p>\n<h2>Weekly league and alliances (optional)<\/h2>\n<p>Nothing is sent until you choose to enter the league. When you do, our league server stores:<\/p>\n<ul><li>the <b>colony name<\/b> you pick (2 to 20 characters) and, if you found or join one, your <b>alliance's name<\/b> and invite code;<\/li><li>your <b>weekly scores<\/b> and the points you added to your alliance each week;<\/li><li>a random <b>player ID<\/b> and a secret key that proves the entry is yours (the server keeps only a scrambled hash of the key), plus when the entry was created and last used.<\/li><\/ul>\n<p><b>Public:<\/b> other players can see your colony name, alliance, score and rank on the leaderboards, and alliance members see each other's names and points. Please don't use your real name or anything personal as a colony or alliance name.<\/p>\n<p>The league server runs on <b>Supabase<\/b> in Frankfurt, Germany (EU). Like any web service, it briefly logs technical request data such as IP addresses for security and troubleshooting; we don't use these to identify players.<\/p>\n<p><b>Why:<\/b> to run the league you asked to join (performance of our agreement with you).<\/p>\n<p><b>How long:<\/b> until you delete your entry. \"Delete my league entry\" in the League tab removes your player record, names, scores and alliance points from the server immediately; if you were the last member of an alliance, the alliance is deleted too. Deleting your save does not delete your league entry, so do that first if you want both gone.<\/p>\n<h2>Anonymous play statistics (Google Play and Steam versions)<\/h2>\n<p>To learn which parts of the game people enjoy and where they get stuck, the store versions send short event messages to <b>PostHog<\/b> (PostHog Cloud EU, servers in Frankfurt, Germany). Each message contains:<\/p>\n<ul><li>the event: game session started, tutorial step reached or finished, Nuptial Flight or Supercolony taken, pack opened, purchase made (product and displayed price), ad reward claimed, lottery spin and prize, share button used, milestone reached, league or alliance joined;<\/li><li>a few game numbers (flights, supercolonies, rough size of your colony, amber balance) and the platform (Android or Steam);<\/li><li>a random <b>install ID<\/b> created by the game. It is not linked to your name, email, Google or Steam account, advertising ID or league entry.<\/li><\/ul>\n<p>The PostHog project is set to <b>discard IP addresses<\/b>, and the game asks PostHog not to look up your location. No screen recordings are made.<\/p>\n<p><b>Why:<\/b> our legitimate interest in improving the game. <b>Your choice:<\/b> switch off \"Share anonymous play statistics\" under Privacy in the Flight tab; nothing more is sent from then on. To have statistics already sent deleted, email us the install ID shown in the same place. Deleting your save also starts a new install ID.<\/p>\n<p><b>How long:<\/b> statistics are kept for as long as they're useful for improving the game, and at most 2 years.<\/p>\n<h2>Sharing your colony<\/h2>\n<p>\"Share my colony\" draws a poster image on your device (your colony name, crumbs per second and a few game totals) and opens your device's share sheet or saves the image. Where it goes is up to you; we don't receive the image. The statistics above only record that the share button was used.<\/p>\n<h2>Ads (Android only)<\/h2>\n<p>The Android version shows <b>rewarded ads only when you tap a \"watch\" button<\/b>. Ads are served by <b>Google AdMob<\/b>. When an ad loads, Google may collect your device's advertising ID, IP address, device and app information, and ad interactions, to show and measure ads and prevent fraud. In the EEA, UK and Switzerland, the game asks for your consent before ads are personalised, and you can change your choice any time under \"Ad privacy choices\". You can also reset or delete your advertising ID in your Android settings. See how Google uses information: <a href=\"https://policies.google.com/technologies/partner-sites\" target=\"_blank\" rel=\"noopener\">https://policies.google.com/technologies/partner-sites<\/a><\/p>\n<p>The Steam version and the browser preview have no ads.<\/p>\n<h2>Purchases<\/h2>\n<p>Purchases on Android go through <b>Google Play<\/b>; we never see your card or payment details. To confirm and restore purchases we use <b>RevenueCat<\/b>, which receives the purchase receipt, the product, price, currency and store country, and a random app user ID. See <a href=\"https://www.revenuecat.com/privacy\" target=\"_blank\" rel=\"noopener\">https://www.revenuecat.com/privacy<\/a><\/p>\n<h2>Steam<\/h2>\n<p>The Steam version uses Valve's Steam services for purchases, achievements and Steam Cloud saves, under Valve's privacy policy: <a href=\"https://store.steampowered.com/privacy_agreement/\" target=\"_blank\" rel=\"noopener\">https://store.steampowered.com/privacy_agreement/<\/a><\/p>\n<h2>Fonts<\/h2>\n<p>The game loads its two typefaces from <b>Google Fonts<\/b>, so your device contacts Google's servers, which see your IP address. See <a href=\"https://developers.google.com/fonts/faq/privacy\" target=\"_blank\" rel=\"noopener\">https://developers.google.com/fonts/faq/privacy<\/a><\/p>\n<h2>Browser preview on claude.ai<\/h2>\n<p>The preview runs inside claude.ai. Ads and purchases there are simulated and nothing is charged, and play statistics are off. If the league server can't be reached, the preview keeps its league inside the page's own claude.ai storage, where other people who open the same preview can see your colony name and score.<\/p>\n<h2>Children<\/h2>\n<p>Formic Republic is not directed at children under 13, and we don't knowingly collect information from them. If you believe a child has entered the league, contact us and we will delete the entry.<\/p>\n<h2>Where information is processed<\/h2>\n<p>The league server and the play statistics are hosted in the EU. Google, RevenueCat and Valve may process information in other countries, including the United States, under their own safeguards such as the EU Standard Contractual Clauses.<\/p>\n<h2>Your rights<\/h2>\n<p>Depending on where you live (for example under the EU and UK GDPR), you can ask to access, correct or delete information about you, object to or restrict its use, and take a copy of it. Most of this you can do yourself in the game: rename or delete your league entry, switch statistics off, delete your save. For anything else, email <b>[CONTACT EMAIL]<\/b>; for statistics or league requests, include your install ID or colony name so we can find the data. You also have the right to complain to your local data protection authority.<\/p>\n<h2>Changes<\/h2>\n<p>If this policy changes, we'll update the date at the top and, for important changes, tell you in the game.<\/p>";
/* ============================================================

const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n, dec){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n, dec);
  if (n < 1000){
    if (dec && n < 100 && n % 1) return n.toFixed(1);
    return String(Math.floor(n));
  }
  const i = Math.floor(Math.log10(n)/3);
  if (i >= SUF.length) return n.toExponential(2);
  const v = n / Math.pow(10, 3*i);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + ' ' + SUF[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if (!isFinite(sec) || sec > 3.15e9) return 'centuries';
  if (sec >= 31536000) return `${Math.floor(sec/31536000)}y ${Math.floor(sec%31536000/86400)}d`;
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}
function clock(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }

  if (f.raidSpeed) out.push(`Raids ${pctf(f.raidSpeed*l)} faster`);
  if (f.picnic) out.push(`Picnics +${pctf(f.picnic*l)}`);
  if (f.offline) out.push(`Offline speed +${pctf(f.offline*l)}`);
  if (f.cost) out.push(`Castes ${pctf(f.cost*l)} cheaper`);

function tierNeed(t){ return 400 + t*80; }
function passTier(xp){ let t = 0; while (t < PASS_TIERS && xp >= tierNeed(t)){ xp -= tierNeed(t); t++; } return {tier:t, into:xp, need: t < PASS_TIERS ? tierNeed(t) : BONUS_XP}; }
function passReward(t, prem){
  const U = PASS_USES;
  if (!prem){
    if (t === PASS_TIERS) return {t:'card', id:'l1'};
    if (t % 10 === 0) return {t:'pack', id:'epic'};
    if (t % 5 === 0) return {t:'jelly', n:1};
    const c = t % 4;
    return c===1 ? {t:'gems', n:15} : c===2 ? {t:'pack', id:'common'} : c===3 ? {t:'crumbs', min:10} : {t:'use', id:U[t % U.length], n:1};

function derive(s, now){
  now = now || Date.now();
  const d = {prod:{}, tap:1, tapcps:0, global:1, offline:0.5, picnic:1, ferDecay:1, maps:false, rations:false, almanac:false};
  PRODUCERS.forEach(p => d.prod[p.id] = 1);
  for (const id of (s.chal === 'burning' ? [] : s.bought)){
    const u = UPG_BY_ID[id]; if (!u) continue;
    const f = u.fx;
    if (f.type==='prod') d.prod[f.id] *= f.x;
    else if (f.type==='tap') d.tap *= f.x;
    else if (f.type==='tapcps') d.tapcps += f.x;
    else if (f.type==='global') d.global *= f.x;
    else if (f.type==='offline') d.offline = f.x;
    else if (f.type==='picnic') d.picnic *= f.x;
    else if (f.type==='ferdecay') d.ferDecay *= f.x;
    else d[f.type] = true;
  }
  const e = s.edicts;
  const cf = {prod:{}, global:0, tap:0, fervor:0, raid:0, picnic:0, offline:0, cost:0, raidSpeed:0, war:0, pherGain:0, abyss:0, crownGain:0, drone:0};
  for (const [cid, lv] of Object.entries(s.cards||{})){
    const c = CARD_BY_ID[cid]; if (!c) continue; const f = c.fx;
    if (f.prod) cf.prod[f.prod] = (cf.prod[f.prod]||0) + f.v*lv;
    for (const k of ['global','tap','fervor','raid','picnic','offline','cost','raidSpeed','war','pherGain','abyss','crownGain','drone']) if (f[k]) cf[k] += f[k]*lv;
  }
  d.cards = cf;
  d.offline += cf.offline + (s.iap && s.iap.owned.party ? .25 : 0); d.picnic *= 1 + cf.picnic;
  COSTMULT = Math.max(.6, 1 - cf.cost) * (s.chal === 'austerity' ? 3 : 1);
  d.season = s.chal === 'winter' ? Object.assign(seasonAt(now), SEASONS[3], {fx:'output −60% (hardship)'}) : seasonAt(now);
  d.seasonProd = s.chal === 'winter' ? .4 : (d.season.id==='winter' && d.almanac) ? 1 : d.season.prod;
  d.pher = 1 + s.pher*pherRate(s);
  d.medal = 1 + s.medals.length*MEDAL_BONUS;
  d.decree = 1 + (e.decree||0)*0.25;
  const rp = s.chal === 'burning' ? {} : (s.rep||{});
  d.rep = rp;
  const hardN = Object.values(s.hard||{}).reduce((a,b)=>a+b,0);
  d.warMult = Math.pow(1.15, (s.war||{}).beaten||0);
  d.endMult = d.warMult * (s.pass && s.pass.premium ? 1 + PREM_OUTPUT : 1) * (1 + .05*(s.crownsTotal||0)) * (1 + .25*((s.doctrine||{}).network||0)) * Math.pow(1.2, hardN) * (1 + .05*(rp.eff||0));
  let pb = 1, tb = 1; d.buffs = [];
  for (const b of s.buffs) if (b.until > now){ pb *= b.prod||1; tb *= b.tap||1; d.buffs.push(b); }
  d.prodBuff = pb; d.tapBuff = tb;
  d.each = {}; d.baseCps = 0;
  PRODUCERS.forEach(p => {
    d.each[p.id] = p.cps * d.prod[p.id] * d.global * d.pher * d.medal * d.decree * (1 + (cf.prod[p.id]||0)) * (1 + cf.global) * d.endMult;
    d.baseCps += d.each[p.id] * (s.owned[p.id]||0);
  });
  d.cps = d.baseCps * pb * d.seasonProd;
  d.baseTap = (d.tap * d.pher * d.medal + d.baseCps * d.tapcps) * (1 + cf.tap) * (1 + .1*(rp.mand||0));
  d.tapValue = d.baseTap * tb * d.season.tap;
  if (s.chal === 'pacifist') d.tapValue = 0;
  d.offlineCap = ((s.doctrine||{}).longnight ? 72 : e.night ? 24 : 12) * 3600;
  d.fervMax = 3 + (e.fervor||0) + cf.fervor;
  d.drones = s.chal === 'pacifist' ? 0 : (e.drone||0) + cf.drone;
  d.abyssMult = 1 + cf.abyss;
  d.expSpeed = (d.maps ? .75 : 1) * (1 - (e.veterans||0)*.15) * Math.max(.5, 1 - cf.raidSpeed);
  d.expLoot = (d.rations ? 1.5 : 1) * (1 + (e.veterans||0)*.2) * d.season.picnic * (1 + cf.raid) * (1 + .05*(rp.loot||0));
  d.warDps = d.baseCps * ((s.doctrine||{}).totalwar ? 3 : 1) * (1 + .05*(rp.loot||0)) * (1 + cf.raid) * (1 + cf.war);
  return d;
}
function costOf(p, owned, n){ return COSTMULT * p.base * Math.pow(GROWTH, owned) * (Math.pow(GROWTH, n) - 1) / (GROWTH - 1); }
function maxAffordable(p, owned, bank){
  bank = bank / COSTMULT;
  const first = p.base * Math.pow(GROWTH, owned);
  return Math.max(0, Math.floor(Math.log(bank*(GROWTH-1)/first + 1) / Math.log(GROWTH)));
}
function upgCost(u){ return u.cost * (D ? D.season.research : 1); }
function pherBoost(s){ return ((s.doctrine && s.doctrine.swarming) ? 1.5 : 1) * (1 + .1*((s.cards||{}).m6||0)); }
// Pheromones: cube root of crumbs gathered since the last Supercolony, over 1e9 (was 1e7), so the first
// flight lands on day 2-4 and the Supercolony around day 8-13 instead of day 2-5 (see tools/sim.js).
function pherPotential(s){ return Math.floor(Math.cbrt((s.ascLife||0) / 1e9) * pherBoost(s)); }
function pherGain(s){ return Math.max(0, pherPotential(s) - s.pher); }
function nextPherAt(s){ const n = Math.max(pherPotential(s), s.pher) + 1; return Math.pow(n/pherBoost(s), 3)*1e9; }
function availableUpgrades(s){ return UPGRADES.filter(u => !s.bought.includes(u.id) && u.unlocked(s)).sort((a,b) => a.cost-b.cost); }
function nextLockedUpgrade(s){ return UPGRADES.filter(u => !s.bought.includes(u.id) && !u.unlocked(s)).sort((a,b) => a.cost-b.cost)[0]; }

const PERMA = ['abyss','dir','medals','seenMedals','lifetime','taps','picnics','anteaters','flyers','rubbles','incidents','raids','daily','quotaN','flags','sound','started',

function resetRun(s, extra){ const k = {}; for (const f of PERMA) k[f] = s[f]; Object.assign(s, fresh(), k, extra); }
function nuptialFlight(s, force){
  const g = pherGain(s); if (g < 1 && !force) return 0;
  const keepAll = s.doctrine.archive;
  const keepIds = keepAll ? s.bought.slice() : s.edicts.memory ? s.bought.filter(id => /^(plan|mand)-/.test(id)) : [];
  resetRun(s, {pher:s.pher+g, jelly:s.jelly+g, edicts:s.edicts, flights:s.flights+1, ascLife:s.ascLife, rep: keepAll ? s.rep : {}, chal:null});
  s.bought = keepIds;
  if (s.edicts.brood){ s.owned.forager = 10; s.owned.aphid = 5; }
  return g;
}
function crownGain(s){ return s.pher >= SUPER_REQ ? Math.floor(3*Math.pow(s.pher/SUPER_REQ, .6) * (1 + .2*((s.cards||{}).p5||0))) : 0; }
function supercolony(s){
  const g = crownGain(s); if (!g) return 0;
  const cellar = s.doctrine.cellar;
  resetRun(s, {crowns:s.crowns+g, crownsTotal:s.crownsTotal+g, supers:s.supers+1, pher:0, flights:s.flights, edicts: cellar ? s.edicts : {}, jelly: cellar ? s.jelly : 0, ascLife:0, rep:{}, chal:null});
  return g;
}

function gain(x){
  S.crumbs += x; S.run += x; S.lifetime += x; S.ascLife += x;
  track('gather', x);
}
function spend(x){ S.crumbs = Math.max(0, S.crumbs - x); }
function bump(){
  try { $('crumbs').animate([{transform:'scale(1.14)', color:'#fff1cf'},{transform:'scale(1)'}], {duration:420, easing:'ease-out'}); } catch(e){}
}
function addBuff(b){
  const now = Date.now();
  const good = (b.prod||1) >= 1 && (b.tap||1) >= 1;
  const dur = b.dur * (good && S.edicts.agitprop ? 1.5 : 1);
  S.buffs = S.buffs.filter(x => x.until > now && x.name !== b.name);
  S.buffs.push({name:b.name, prod:b.prod||1, tap:b.tap||1, until: now + dur*1000, dur, gold:!!b.gold});
  D = derive(S);
}
function fervMult(){ return 1 + fervor * (D.fervMax - 1); }

function addGems(n){
  if (!(n > 0)) return;
  S.gems += n;
  const gp = $('gempill'); if (gp){ gp.classList.remove('bump'); void gp.offsetWidth; gp.classList.add('bump'); }
}
function merit(n){
  const before = passTier(S.pass.xp).tier;
  leagueAdd(n);   // weekly league score = base merit (the premium boost does not count)
  S.pass.xp += S.pass.premium ? n * PREM_MERIT : n;
  const after = passTier(S.pass.xp).tier;
  if (after > before){ toast(`Pass tier ${after} reached`, 'New rewards are waiting in the Pass tab.', 'gold', 'ticket'); Sound.stamp(); }
}

function dlg({band, text, ok, wait}){
  return new Promise(res => {
    const ov = $('adov'), okb = $('ad-ok'), cb = $('ad-cancel'), scr = $('ad-screen');
    $('ad-band').textContent = band; $('ad-text').textContent = text;
    scr.hidden = !wait; okb.textContent = ok; okb.disabled = !!wait;
    let left = wait || 0, timer = null;
    if (wait){
      $('ad-count').textContent = left;
      timer = setInterval(() => { left--; $('ad-count').textContent = left > 0 ? left : '✓';
        if (left <= 0){ clearInterval(timer); okb.disabled = false; okb.focus(); } }, 1000);
    }
    ov.hidden = false;
    const done = v => { clearInterval(timer); ov.hidden = true; okb.onclick = cb.onclick = null; res(v); };
    okb.onclick = () => done(true); cb.onclick = () => done(false);
  });
}
/* ---------- PLATFORM ----------
   The store shell sets window.FR_PLATFORM before this script runs, and
   window.FR_send(msg) to talk to native code. Native answers via FR_receive.
     web     (default) simulated ads and checkout, nothing charged
     android Expo shell: AdMob rewarded ads + Google Play purchases (RevenueCat)
     steam   Electron shell: no ads (rewards are free claims), Steam purchases,
             Steam achievements, save file for Steam Cloud */
const PLATFORM = Object.assign({id:'web', privacyUrl:'', adChoices:false, ads:true, skus:null, restore:false, achievements:false, fileSave:false, initialSave:null}, window.FR_PLATFORM || {});
const hasNative = typeof window.FR_send === 'function';
const Native = {
  seq: 0, wait: {},
  call(type, data){ return new Promise(res => { const id = ++this.seq; this.wait[id] = res; window.FR_send(Object.assign({id, type}, data)); }); },
  post(type, data){ if (hasNative) try { window.FR_send(Object.assign({type}, data)); } catch(e){} },
};
window.FR_receive = msg => {
  if (!msg) return;
  if (msg.id && Native.wait[msg.id]){ const r = Native.wait[msg.id]; delete Native.wait[msg.id]; r(msg.result || {}); }
  if (msg.prices){ for (const [k,v] of Object.entries(msg.prices)) if (IAP[k] && v) IAP[k].price = v; if (S && tab === 'shop') render(); }
};
if (typeof window.FR_onMessage === 'function') window.FR_onMessage(window.FR_receive);
function openExternal(url){ if (!url) return; if (hasNative) Native.post('open', {url}); else window.open(url, '_blank', 'noopener'); }

function sold(sku){ return !PLATFORM.skus || PLATFORM.skus.includes(sku); }
function adFree(){ return !PLATFORM.ads || !!S.iap.owned.party; }

const Monetize = {
  test: !hasNative,
  // Resolves true only if the player watched the whole ad (or the platform has no ads).
  async showRewarded(placement){
    if (!PLATFORM.ads) return true;
    if (hasNative){
      const r = await Native.call('ad', {placement});
      if (!r.ok && r.error) toast('No broadcast available', r.error, 'bad', 'radio');
      return !!r.ok;
    }
    return dlg({band:'Sponsored broadcast · test ad', wait:5, ok:'Claim reward',
      text:'In the real app a rewarded video plays here. Closing early gives no reward.'});
  },
  // Resolves true only if the store confirmed the payment.
  async purchase(sku){
    if (hasNative){
      const r = await Native.call('buy', {sku});
      if (!r.ok && r.error) toast('Purchase not completed', r.error, 'bad', 'bag');
      return !!r.ok;
    }
    const it = IAP[sku];
    return dlg({band:'Checkout · test mode', ok:`Buy for ${it.price}`,
      text:`${it.name}. This is a browser preview, so no money is charged. In the app this opens the Google Play or Steam payment sheet.`});
  },
  // Resolves to {owned:[sku,...]} of one-time purchases the store knows about.
  restore(){ return hasNative && PLATFORM.restore ? Native.call('restore', {}) : Promise.resolve({owned:[]}); },
  achievement(id){ if (PLATFORM.achievements) Native.post('achievement', {id}); },
};

function adDay(){ const k = dayKey(Date.now()); if (S.ads.day !== k){ S.ads.day = k; S.ads.n = {}; S.ads.ex = 0; } return S.ads.n; }
function adLeft(k){ return Math.max(0, AD_REWARDS[k].cap - (adDay()[k]||0)); }
let adBusy = false;
async function watchFor(k){
  if (adBusy || adLeft(k) <= 0) return;
  adBusy = true;
  const ok = adFree() ? true : await Monetize.showRewarded(k);
  adBusy = false;
  if (!ok) return;
  adDay()[k] = (adDay()[k]||0) + 1;
  Analytics.ev('ad_reward', {placement: k});
  const r = AD_REWARDS[k];
  if (k === 'amber') addGems(8);
  else if (k === 'boost') addBuff({name:'State Television', prod:2, dur:900, gold:true});
  else if (k === 'pack') S.packs.common = (S.packs.common||0) + 1;
  toast(r.name, r.desc + (k==='pack' ? '. Open it in Cards.' : '.'), 'gold', r.icon); Sound.good();
  afterChange(); render();
}
// Called after the store confirms a purchase (in Expo: after RevenueCat says the purchase is valid).
function grantIAP(sku){
  const it = IAP[sku];
  if (sku.startsWith('amber')){
    const first = !S.iap.first[sku]; S.iap.first[sku] = true;
    const n = (it.amber + it.bonus) * (first ? 2 : 1); addGems(n);
    return `+${fmt(n)} amber` + (first ? ' (first purchase doubled!)' : '');
  }
  if (sku === 'starter'){ S.iap.owned.starter = true; addGems(300); S.packs.epic = (S.packs.epic||0) + 1;
    S.inv.rush = (S.inv.rush||0) + 3; S.inv.hourglass = (S.inv.hourglass||0) + 1; return '300 amber, a Politburo Pack and 4 usables.'; }
  if (sku === 'party'){ S.iap.owned.party = true; return 'Broadcast rewards are now instant, and offline gathering is up 25%.'; }
  if (sku === 'autotap'){ S.iap.owned.autotap = true; S.auto.forever = true; S.auto.on = true; return 'The Eternal Auto-Tapper is working. Switch it off in the Shop whenever you like.'; }
  if (sku === 'pass'){ unlockPremium(); return 'Premium unlocked: +50% merit, +10% output and a free Politburo Pack. Claim your rewards in the Pass.'; }
}

/* ---------- amber shop, packs, cards, usables, pass ---------- */
function rollRarity(odds){ let r = Math.random(); for (const k of ['P','M','L','E','R','C']){ if ((r -= (odds[k]||0)) < 0) return k; } return 'C'; }
function grantCard(cid){
  const c = CARD_BY_ID[cid], lv = S.cards[cid]||0;
  if (!lv){ S.cards[cid] = 1; S.shards[cid] = 0; return {c, lv:1, kind:'new'}; }
  if (lv >= CARD_MAX){ const g = RARITY[c.r].dust; addGems(g); return {c, lv, kind:'dust', g}; }
  S.shards[cid] = (S.shards[cid]||0) + 1;
  if (S.shards[cid] >= lv){ S.shards[cid] = 0; S.cards[cid] = lv + 1; return {c, lv: lv+1, kind:'up'}; }
  return {c, lv, kind:'shard', sh:S.shards[cid]};
}
function openPack(id){
  const pk = PACKS[id]; if (!(S.packs[id] > 0)) return null;
  S.packs[id]--; if (!S.packs[id]) delete S.packs[id];
  const rars = Array.from({length:pk.n}, () => rollRarity(pk.odds));
  const last = pk.n - 1;
  if (pk.guar && RAR_ORDER.indexOf(rars[last]) < RAR_ORDER.indexOf(pk.guar)) rars[last] = pk.guar;
  if (!S.flags.pack1){ S.flags.pack1 = 1; if (rars[last] === 'C') rars[last] = 'R'; }
  S.pity = (S.pity||0) + 1;
  const mythPool = CARDS.filter(c => c.r === 'M' && mythicUnlocked(c));
  for (let i = 0; i < rars.length; i++) if (rars[i] === 'M' && !mythPool.length) rars[i] = 'L';
  for (let i = 0; i < rars.length; i++) if (rars[i] === 'P' && !primUnlocked()) rars[i] = 'L';
  if (id === 'primordial'){ S.abyss.ppity++; if (!rars.includes('P') && S.abyss.ppity >= PRIM_PITY) rars[last] = 'P'; if (rars.includes('P')) S.abyss.ppity = 0; }
  if (!rars.some(r => r === 'L' || r === 'M' || r === 'P') && S.pity >= PITY) rars[last] = 'L';
  if (rars.some(r => r === 'L' || r === 'M' || r === 'P')) S.pity = 0;
  const out = rars.map(r => { const pool = r === 'M' ? mythPool : CARDS.filter(c => c.r === r); return grantCard(pool[Math.floor(Math.random()*pool.length)].id); });
  for (const o of out) if (o.c.r === 'M' && o.kind === 'new'){ toast('A MYTHIC CARD!', `${o.c.name} has revealed itself. ${cardFx(o.c, 1)}.`, 'jelly', o.c.icon); }
  for (const o of out) if (o.c.r === 'P' && o.kind === 'new'){ toast('A PRIMORDIAL CARD!', `${o.c.name} has risen from the deep. ${cardFx(o.c, 1)}.`, 'jelly', o.c.icon); }
  merit(10); track('pack', 1);
  return {pk, out};
}
function grantReward(r){
  if (r.t==='gems') addGems(r.n);
  else if (r.t==='pack') S.packs[r.id] = (S.packs[r.id]||0) + (r.n||1);
  else if (r.t==='crumbs'){ gain(D.baseCps*60*r.min + 100*r.min); bump(); }
  else if (r.t==='use') S.inv[r.id] = (S.inv[r.id]||0) + r.n;
  else if (r.t==='jelly') S.jelly += r.n;
  else if (r.t==='card') grantCard(r.id);
}
function rewardText(r){
  if (r.t==='gems') return `${r.n} amber`;
  if (r.t==='pack') return (r.n > 1 ? r.n + '× ' : '') + PACKS[r.id].name;
  if (r.t==='crumbs') return `${r.min} min of output`;
  if (r.t==='use') return `${r.n}× ${USABLES[r.id].name}`;
  if (r.t==='jelly') return `${r.n} royal jelly`;
  return `${RARITY[CARD_BY_ID[r.id].r].name}: ${CARD_BY_ID[r.id].name}`;
}
function rewardIcon(r){ return r.t==='gems' ? 'gem' : r.t==='pack' ? 'cards' : r.t==='crumbs' ? 'crumb' : r.t==='use' ? USABLES[r.id].icon : r.t==='jelly' ? 'drop' : 'crown'; }
function claimTier(t, prem){
  const list = prem ? S.pass.prem : S.pass.free;
  if (t > passTier(S.pass.xp).tier || list.includes(t) || (prem && !S.pass.premium)) return false;
  list.push(t); grantReward(passReward(t, prem)); return true;
}
function bonusAvailable(){ const p = passTier(S.pass.xp); return p.tier >= PASS_TIERS ? Math.max(0, Math.floor(p.into / BONUS_XP) - S.pass.bonus) : 0; }
function passClaimable(){
  const pt = passTier(S.pass.xp).tier; let n = 0;
  for (let t = 1; t <= pt; t++){ if (!S.pass.free.includes(t)) n++; if (S.pass.premium && !S.pass.prem.includes(t)) n++; }
  return n + bonusAvailable();
}
function claimAll(){
  const pt = passTier(S.pass.xp).tier; let n = 0;
  for (let t = 1; t <= pt; t++){ if (claimTier(t, false)) n++; if (claimTier(t, true)) n++; }
  const b = bonusAvailable(); if (b){ S.pass.bonus += b; const bk = S.pass.premium ? 'epic' : 'rare'; S.packs[bk] = (S.packs[bk]||0) + b; n += b; }
  return n;
}
let shopN = 1;
function shopQty(kind, id){
  if (!['pack','use','jelly'].includes(kind)) return 1;
  if (shopN === 'max') return Math.max(1, Math.min(10000, Math.floor(S.gems / shopPrice(kind, id))));
  return shopN;
}
function exchangeCost(){ return Math.max(5000, D.baseCps*1800); }
function shopPrice(kind, id){ return kind==='pack' ? PACKS[id].price : kind==='use' ? USABLES[id].price : kind==='jelly' ? 80 : kind==='premium' ? PREMIUM_COST : 0; }
function buyShop(kind, id){
  const price = shopPrice(kind, id);
  if (kind==='ration'){ if (S.shopDay === dayKey(Date.now())) return false; S.shopDay = dayKey(Date.now()); S.packs.common = (S.packs.common||0) + 1; return true; }
  if (kind==='exchange'){ const c = exchangeCost(); adDay(); if (S.crumbs < c || S.ads.ex >= EX_CAP) return false; spend(c); S.ads.ex++; addGems(10); return true; }
  if (kind==='premium' && S.pass.premium) return false;
  if (kind==='pack' && !PACKS[id].price) return false;
  const n = shopQty(kind, id), total = price * n;
  if (S.gems < total) return false;
  S.gems -= total;
  if (kind==='pack') S.packs[id] = (S.packs[id]||0) + n;
  else if (kind==='use') S.inv[id] = (S.inv[id]||0) + n;
  else if (kind==='jelly') S.jelly += n;
  else if (kind==='premium') unlockPremium();
  return true;
}
let fervorLockUntil = 0;
let superConfirm = 0, quitArmed = 0, hardArm = {id:null, until:0}, lastAuto = 0;

function siege(sec){

  while (dmg > 0 && S.war.beaten < RIVALS){
    const r = rival(S.war.beaten), need = r.hp - S.war.dmg;
    if (dmg >= need){
      dmg -= need; S.war.dmg = 0; S.war.beaten++;
      addGems(r.gems); S.jelly += 1; if (r.crown){ S.crowns++; S.crownsTotal++; }
      toast('Rival conquered!', `${r.name} has fallen. All output +15% forever, +${r.gems} amber${r.crown ? ', +1 crown' : ''}.`, 'medal', 'swords'); Sound.stamp();
      D = derive(S);
    } else { S.war.dmg += dmg; dmg = 0; }
  }
}

function automate(now){

}

  else if (id==='hourglass'){ if (D.baseCps <= 0){ ok = false; msg = 'Hire some castes first: the hourglass collects their output.'; } else { const v = D.baseCps*3600; gain(v); bump(); msg = `+${fmt(v)} crumbs: one hour of labour, instantly.`; } }

function doTap(auto){
  lastCrit = D.tapValue > 0 && Math.random() < critChance();
  const v = D.tapValue * fervMult() * (lastCrit ? CRIT_MULT : 1);
  gain(v); S.taps++;
  fervor = Math.min(1, fervor + 0.05); lastTapAt = performance.now();
  if (fervor >= 1) S.flags.fervor = true;
  track('taps', 1);
  if (++S.tapMerit >= 10){ S.tapMerit = 0; merit(1); }
  if (!auto){ Sound.tap(); buzz(6); }   // the auto-tapper works quietly
  return v;
}
function buyProducer(id, n){
  const p = PRODUCERS.find(q => q.id===id); const owned = S.owned[id]||0;
  const c = costOf(p, owned, n);
  if (n<1 || c > S.crumbs + 1e-9) return false;
  spend(c); S.owned[id] = owned + n;
  track('hire', n); track('hire_' + id, n);
  return true;
}
function buyUpgrade(id){
  const u = UPG_BY_ID[id];
  if (S.chal === 'burning') return false;
  if (!u || S.bought.includes(id) || !u.unlocked(S) || S.crumbs < upgCost(u)) return false;
  spend(upgCost(u)); S.bought.push(id);
  track('research', 1);
  return true;
}
function buyEdict(id){
  const e = EDICTS.find(x => x.id===id); const l = S.edicts[id]||0;
  if (l >= e.max || S.jelly < e.cost(l)) return false;
  S.jelly -= e.cost(l); S.edicts[id] = l+1; return true;
}

/* ---------- raids (expeditions) ---------- */
function expUnlocked(x){ return !x.req || (S.owned[x.req]||0) > 0; }
function expDur(x){ return x.dur * D.expSpeed * (x.id === 'kitchen' && !S.raids && !S.exp.kitchen ? .25 : 1); }
function expLootEst(x){ return (D.baseCps * x.dur * x.mult + 40*x.squad) * D.expLoot; }
function canSend(x){ return !S.exp[x.id] && expUnlocked(x) && (S.owned.forager||0) >= x.squad; }
function sendExp(id){
  const x = EXP_BY_ID[id]; if (!canSend(x)) return false;
  const loot = expLootEst(x), now = Date.now();
  S.owned.forager -= x.squad;
  S.exp[id] = {start:now, end: now + expDur(x)*1000, loot, squad:x.squad};
  track('send', 1);
  return true;
}
function collectExp(id){
  const e = S.exp[id]; if (!e || Date.now() < e.end) return null;
  const x = EXP_BY_ID[id];
  S.owned.forager = (S.owned.forager||0) + e.squad;
  gain(e.loot);
  let j = 0; if (Math.random() < x.jelly) j++; if (x.jelly >= 1 && Math.random() < .5) j++;
  S.jelly += j; S.raids++;
  if (id === 'moon') S.flags.moon = true;
  const gm = RAID_GEMS[id]||0; addGems(gm); merit(20 + Math.round(x.dur/120));
  delete S.exp[id];
  track('raid', 1);
  return {loot:e.loot, j, x, gm};
}
function raidsReady(){ return Object.entries(S.exp).filter(([,e]) => Date.now() >= e.end).length; }
